<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>BLUEPRINT CRM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
html{color-scheme:dark}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

:root{
  /* Blueprint — tema oscuro único, construido sobre el negro y el azul del logo.
     Un solo tema a propósito: el glow no existe sobre fondo claro. */
  color-scheme:dark;   /* que los date/time nativos salgan oscuros, no blancos */
  --brand:#5FB2EC; --brand-hi:#A8DBFF; --brand-dim:#2E6FA8;
  --ground:#04070B; --surface:#111A24; --surface-2:#1A2532; --surface-3:#253444;
  --ink:#F4F9FE; --ink-2:#C4D3E1; --muted:#8698A9;
  --line:#26333F; --line-2:#3A4B5E;
  --accent:#5FB2EC; --accent-ink:#03121D; --accent-soft:#132D45; --accent-line:#39709E;
  --good:#4FD69A; --good-soft:#0B2D1F;
  --warn:#F0B85C; --warn-soft:#302512;
  --crit:#FF9280; --crit-soft:#361A16;
  --cool:#8FCFF5; --cool-soft:#142C42;
  --bar:#5FB2EC; --bar-track:#0B1219;
  /* gradientes: una sola familia, siempre el azul del logo */
  --grad-bar:linear-gradient(90deg,#2E6FA8 0%,#5FB2EC 55%,#A8DBFF 100%);
  --grad-text:linear-gradient(96deg,#57ACE8 0%,#7FC6F4 45%,#A8DBFF 100%);
  --grad-line:linear-gradient(90deg,#5FB2EC,rgba(95,178,236,0) 78%);
  --r:12px;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 2px 8px rgba(0,0,0,.5), 0 20px 40px -24px rgba(0,0,0,.9);
  /* El glow: una sola familia, siempre el azul de marca */
  --glow-sm:0 0 14px -2px rgba(95,178,236,.55);
  --glow-md:0 0 26px -4px rgba(95,178,236,.65);
  --glow-lg:0 0 48px -8px rgba(95,178,236,.5);
  --nav-h:60px;
  /* Los 5 bloques son una secuencia: una sola rampa de azul */
  --blk0-bg:#1D2833; --blk0-fg:#93A5B5;
  --blk1-bg:#122839; --blk1-fg:#8CC4EC;
  --blk2-bg:#153650; --blk2-fg:#A2D3F4;
  --blk3-bg:#194768; --blk3-fg:#BEE2FA;
  --blk4-bg:#5FB2EC; --blk4-fg:#03121D;
}

*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  /* Dos luces azules muy tenues: le dan profundidad al negro en vez de dejarlo plano */
  background-image:
    radial-gradient(920px 540px at 14% -8%, rgba(95,178,236,.16), transparent 62%),
    radial-gradient(780px 470px at 92% 3%, rgba(95,178,236,.09), transparent 58%),
    linear-gradient(rgba(95,178,236,.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(95,178,236,.028) 1px, transparent 1px);
  background-size:auto, auto, 44px 44px, 44px 44px;
  background-attachment:fixed;
  font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:15px; line-height:1.5; margin:0;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Archivo", ui-sans-serif, system-ui, sans-serif; font-weight:700; margin:0; text-wrap:balance; letter-spacing:-.012em}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
.mono{font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:5px; box-shadow:var(--glow-sm)}

/* ---------- shell ---------- */
.app{display:flex; min-height:100vh}
.rail{display:none}
.main{flex:1; min-width:0; padding:0 0 calc(var(--nav-h) + 20px)}
.wrap{max-width:1140px; margin:0 auto; padding:0 16px}

.topbar{
  position:sticky; top:0; z-index:30; border-bottom:1px solid var(--line);
  background:rgba(7,10,14,.78); backdrop-filter:blur(14px);
}
.topbar-in{max-width:1140px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:12px}
.brand{display:flex; align-items:center; gap:9px; min-width:0}
.brand img, .rail-brand img{display:block; flex:none}
.brand img{width:26px; height:26px; border-radius:50%}
.rail-brand img{width:34px; height:34px; border-radius:50%; margin-bottom:9px}
.brand b{font-family:"Archivo",sans-serif; font-weight:700; font-size:17px; letter-spacing:-.02em}
.brand span{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); white-space:nowrap}
@media (min-width:900px){ .brand b{display:none} }
.spacer{flex:1}

.roleswitch{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:2px}
.roleswitch button{
  border:0; background:transparent; color:var(--muted); font-size:12.5px; font-weight:600;
  padding:5px 12px; border-radius:999px; letter-spacing:.01em; white-space:nowrap;
}
.roleswitch button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* bottom nav (mobile) */
.nav{
  position:fixed; bottom:0; left:0; right:0; z-index:40; height:var(--nav-h);
  background:rgba(12,17,24,.92); backdrop-filter:blur(14px); border-top:1px solid var(--line);
  display:flex; padding-bottom:env(safe-area-inset-bottom);
}
.nav button{
  flex:1; border:0; background:transparent; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:10.5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; padding:0;
  border-top:2px solid transparent; margin-top:-1px;
}
.nav button svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--brand-hi); border-top-color:var(--brand);
  box-shadow:0 -8px 22px -12px rgba(107,175,224,.9)}
.nav button[aria-current="page"] svg{filter:drop-shadow(0 0 6px rgba(107,175,224,.7))}
.nav .badge{
  position:absolute; transform:translate(14px,-11px); background:var(--crit); color:#fff;
  border-radius:999px; font-size:9.5px; min-width:16px; height:16px; line-height:16px; padding:0 4px;
  font-family:"IBM Plex Mono",monospace; font-weight:500;
}

@media (min-width:900px){
  .nav{display:none}
  .rail{
    display:flex; flex-direction:column; gap:3px; width:204px; flex:none;
    padding:18px 12px; border-right:1px solid var(--line); position:sticky; top:0; height:100vh;
    background:linear-gradient(180deg, rgba(20,28,38,.92), rgba(10,14,20,.92));
    backdrop-filter:blur(12px);
  }
  .rail .rail-brand{padding:6px 10px 18px}
  .rail .rail-brand b{display:block; font-family:"Archivo",sans-serif; font-size:18px; letter-spacing:-.02em}
  .rail .rail-brand span{font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted)}
  .rail button.railbtn{
    display:flex; align-items:center; gap:10px; border:0; background:transparent; color:var(--ink-2);
    padding:9px 10px; border-radius:var(--r); font-size:14px; font-weight:500; text-align:left; width:100%;
  }
  .rail button.railbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round; flex:none}
  .rail button.railbtn:hover{background:var(--surface-2)}
  .rail button.railbtn[aria-current="page"]{
    background:linear-gradient(90deg, rgba(107,175,224,.20), rgba(107,175,224,.05));
    color:var(--brand-hi); font-weight:600;
    box-shadow:inset 2px 0 0 var(--brand), var(--glow-sm);
  }
  .rail button.railbtn[aria-current="page"] svg{filter:drop-shadow(0 0 6px rgba(107,175,224,.7))}
  .rail .cnt{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted)}
  .rail button.railbtn[aria-current="page"] .cnt{color:var(--accent)}
  .main{padding-bottom:40px}
  .topbar{background:var(--ground)}
}

/* ---------- generic ---------- */
.section{padding:20px 0 8px}
.eyebrow{
  font-size:10.5px; font-weight:600; letter-spacing:.15em; text-transform:uppercase;
  color:var(--brand); margin:0 0 9px; display:flex; align-items:center; gap:8px;
}
.eyebrow::after{content:""; flex:1; height:1px; background:var(--grad-line); opacity:.4}
.h-row{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.h-row h2{
  font-size:23px; letter-spacing:-.022em;
  background:var(--grad-text); -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
}
.sub{color:var(--muted); font-size:13px}

.card{
  position:relative; overflow:hidden;
  background:linear-gradient(180deg, rgba(95,178,236,.05), rgba(255,255,255,0) 130px), var(--surface);
  border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow);
}
/* filo de luz en el borde de arriba: se apaga hacia los lados */
.card::before, .meter::before, .stat::before{
  content:""; position:absolute; inset:0 0 auto 0; height:1px;
  background:linear-gradient(90deg, transparent, rgba(95,178,236,.55) 25%, rgba(95,178,236,.55) 75%, transparent);
}
.pad{padding:16px}

.btn{
  border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink);
  padding:7px 13px; border-radius:8px; font-size:13.5px; font-weight:500;
  transition:box-shadow .18s ease, background .18s ease, border-color .18s ease;
}
.btn:hover{background:var(--surface-3); border-color:var(--accent-line)}
.btn.primary{background:linear-gradient(180deg, var(--brand-hi), var(--brand)); border-color:var(--brand);
  color:var(--accent-ink); font-weight:600; box-shadow:var(--glow-sm)}
.btn.primary:hover{box-shadow:var(--glow-md); filter:brightness(1.05)}
.btn.ghost{border-color:transparent; background:transparent; color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn.sm{padding:4px 9px; font-size:12.5px}
.btn.danger{color:var(--crit); border-color:var(--crit-soft); background:var(--crit-soft)}
.btn.good{background:linear-gradient(180deg,#6BE3AC,#4FD69A); border-color:#4FD69A; color:#04231A; font-weight:600;
  box-shadow:0 0 14px -2px rgba(79,214,154,.6)}
.btn.good:hover{box-shadow:0 0 24px -4px rgba(79,214,154,.75); filter:brightness(1.05)}
.btn.crit{background:linear-gradient(180deg,#FFA795,#F5806B); border-color:#F5806B; color:#2B0C06; font-weight:600;
  box-shadow:0 0 14px -2px rgba(245,128,107,.55)}
.btn.crit:hover{box-shadow:0 0 24px -4px rgba(245,128,107,.7); filter:brightness(1.05)}
.amountbox{display:flex; gap:6px; align-items:center; flex-wrap:nowrap}
.amountbox input{width:118px; border-color:var(--good); box-shadow:0 0 14px -4px rgba(79,214,154,.6)}
.touchadd{display:flex; gap:6px; align-items:center; margin-top:11px}
.touchadd input{flex:1; min-width:0; font-size:13px; padding:6px 9px}
.amountbox input:focus{border-color:var(--good); box-shadow:0 0 20px -3px rgba(79,214,154,.8)}
.btn[disabled]{opacity:.45; cursor:not-allowed}

input[type=text],input[type=date],input[type=number],input[type=time],select,textarea{
  background:var(--surface-2); border:1px solid var(--line-2); border-radius:8px;
  color-scheme:dark; color:var(--ink);
  padding:7px 9px; font-size:14px; width:100%;
  transition:border-color .16s ease, box-shadow .16s ease;
}
input:hover,select:hover,textarea:hover{border-color:var(--accent-line)}
input[type=file]{background:var(--surface-2); border:1px dashed var(--line-2); padding:10px}
input[type=file]::file-selector-button{
  background:var(--accent-soft); color:var(--brand); border:1px solid var(--accent-line);
  border-radius:7px; padding:5px 12px; margin-right:12px; font:inherit; font-size:13px; font-weight:600; cursor:pointer;
}
input[type=file]::file-selector-button:hover{background:var(--surface-3); box-shadow:var(--glow-sm)}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--brand); box-shadow:var(--glow-sm)}
/* El calendario nativo venía blanco sobre azul: lo pintamos del color de marca */
input[type=date],input[type=time]{font-family:"IBM Plex Mono",monospace; font-size:13.5px; letter-spacing:.01em}
input[type=date]::-webkit-calendar-picker-indicator,
input[type=time]::-webkit-calendar-picker-indicator{
  filter:invert(72%) sepia(38%) saturate(1100%) hue-rotate(174deg) brightness(102%);
  opacity:.85; cursor:pointer;
}
input[type=date]::-webkit-calendar-picker-indicator:hover,
input[type=time]::-webkit-calendar-picker-indicator:hover{opacity:1}
input[type=date]::-webkit-datetime-edit,
input[type=time]::-webkit-datetime-edit{color:var(--ink)}
input[type=date]::-webkit-datetime-edit-text{color:var(--muted); padding:0 1px}
input[type=date]::-webkit-datetime-edit-fields-wrapper{padding:0}
textarea{resize:vertical; min-height:62px; line-height:1.45}
label.f{display:block; font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:0 0 4px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
@media (max-width:640px){.grid3{grid-template-columns:1fr 1fr}}

.chip{
  display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px;
  font-size:11.5px; font-weight:600; letter-spacing:.01em; white-space:nowrap;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line);
}
.chip.b0{background:var(--blk0-bg); color:var(--blk0-fg); border-color:transparent}
.chip.b1{background:var(--blk1-bg); color:var(--blk1-fg); border-color:transparent}
.chip.b2{background:var(--blk2-bg); color:var(--blk2-fg); border-color:transparent}
.chip.b3{background:var(--blk3-bg); color:var(--blk3-fg); border-color:transparent}
.chip.b4{background:var(--blk4-bg); color:var(--blk4-fg); border-color:transparent; box-shadow:var(--glow-sm)}
.chip.crit{background:var(--crit-soft); color:var(--crit); border-color:transparent}
.chip.cool{background:var(--cool-soft); color:var(--cool); border-color:transparent}
.chip.good{background:var(--good-soft); color:var(--good); border-color:transparent}
.chip.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}

.banner{
  display:flex; gap:10px; align-items:flex-start; padding:11px 14px; border-radius:var(--r);
  background:var(--warn-soft); color:var(--warn); font-size:13.5px; margin:14px 0; line-height:1.45;
}
.banner.info{background:var(--accent-soft); color:var(--accent)}
.banner.crit{background:var(--crit-soft); color:var(--crit); box-shadow:inset 0 0 22px -6px rgba(255,146,128,.5)}
.banner b{font-weight:600}
.banner p{margin:0}
.banner .spacer{flex:1}

.empty{text-align:center; padding:44px 20px; color:var(--muted)}
.empty h3{font-size:17px; color:var(--ink); margin-bottom:6px}
.empty p{margin:0 auto 16px; max-width:38ch; font-size:14px}

/* ---------- meters ---------- */
.meters{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px}
.meter{
  position:relative; overflow:hidden;
  background:linear-gradient(180deg, rgba(95,178,236,.06), rgba(255,255,255,0) 70%), var(--surface);
  border:1px solid var(--line); border-radius:var(--r); padding:15px 17px; box-shadow:var(--shadow);
}
.meter-top{display:flex; align-items:baseline; gap:7px; margin-bottom:9px}
.meter-top .lab{font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.meter-top .val{
  font-family:"Archivo",sans-serif; font-weight:700; font-size:24px; letter-spacing:-.03em;
  margin-left:auto; font-variant-numeric:tabular-nums;
  color:var(--brand-hi); text-shadow:0 0 20px rgba(95,178,236,.55);
}
.meter-top .val small{font-size:13px; color:var(--muted); font-weight:600}
.track{
  height:9px; border-radius:99px; background:var(--bar-track); overflow:hidden;
  border:1px solid var(--line); box-shadow:inset 0 1px 3px rgba(0,0,0,.7);
}
.track i{
  display:block; height:100%; border-radius:99px; min-width:3px;
  background:var(--grad-bar); background-size:200% 100%;
  transition:width .5s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 12px rgba(95,178,236,.9), 0 0 26px rgba(95,178,236,.45), inset 0 1px 0 rgba(255,255,255,.35);
}
.track i.done{
  background:linear-gradient(90deg,#1F8A5C 0%,#4FD69A 55%,#B6F5D8 100%);
  box-shadow:0 0 12px rgba(79,214,154,.9), 0 0 26px rgba(79,214,154,.4), inset 0 1px 0 rgba(255,255,255,.35);
}

/* ---------- queue ---------- */
.qgroup{margin-bottom:26px}
/* La cola del closer: lo primero que tiene que ver, y que no se confunda con lo demás */
.qgroup.hero{
  margin-bottom:30px; padding:16px 16px 18px; border-radius:14px;
  background:linear-gradient(180deg, rgba(95,178,236,.10), rgba(95,178,236,.02) 60%), var(--surface);
  border:1px solid var(--accent-line);
  box-shadow:inset 0 0 44px -10px rgba(95,178,236,.30), var(--shadow), 0 0 40px -18px rgba(95,178,236,.75);
}
.qgroup.hero .qhead h3{font-size:16px}
.qgroup.hero .qhead .rule{opacity:.8}
.qgroup.hero .row{background:var(--surface-2); border-color:var(--line-2)}
.qhead{display:flex; align-items:center; gap:9px; margin:0 0 9px; padding:0 2px}
.qhead h3{
  font-size:13.5px; letter-spacing:.005em;
  background:var(--grad-text); -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
}
.qhead .n{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--brand);
  background:var(--accent-soft); border:1px solid var(--accent-line);
  padding:1px 7px; border-radius:99px; line-height:1.5;
}
.qhead .rule{flex:1; height:1px; background:var(--grad-line); opacity:.55}

.rows{display:flex; flex-direction:column; gap:6px}
.row{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:12px 14px; display:flex; align-items:center; gap:12px; text-align:left; width:100%;
  border-left:3px solid var(--line-2);
  transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
}
.row:hover{background:var(--surface-2); border-color:var(--line-2)}
.row.booked{box-shadow:inset 3px 0 0 var(--brand), 0 0 20px -12px rgba(107,175,224,.8)}
.row.late{border-left-color:var(--crit)}
.row.due{border-left-color:var(--accent)}
.row.cold{border-left-color:var(--warn)}
.row.booked{border-left-color:var(--cool)}
.row.done{opacity:.62}
.row-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; background:none; border:0; padding:0; cursor:pointer}
.row-l1{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.row-l1 .h{font-family:"IBM Plex Mono",monospace; font-size:14px; font-weight:500; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%}
.row-l1 .n{font-size:13px; color:var(--muted)}
.row-l2{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12px; color:var(--muted)}
.row-acts{display:flex; gap:5px; flex:none}
.row-acts .btn{padding:5px 10px; font-size:12.5px}
@media (max-width:700px){
  .row{flex-wrap:wrap}
  .row-acts{width:100%; padding-top:2px}
  .row-acts .btn{flex:1}
}
.stepdots{display:inline-flex; gap:3px; align-items:center}
.stepdots i{width:6px; height:6px; border-radius:50%; background:var(--line-2); display:block}
.stepdots i.on{background:var(--brand); box-shadow:0 0 7px rgba(95,178,236,.9)}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface); box-shadow:var(--shadow)}
table{border-collapse:collapse; width:100%; font-size:13.5px}
th,td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
th{font-size:10.5px; font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-2); background:var(--surface-2); position:sticky; top:0; border-bottom:1px solid var(--line-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.r,th.r{text-align:right; font-variant-numeric:tabular-nums}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:500;font-family:"IBM Plex Mono",monospace;font-size:13.5px}
.linkish:hover{text-decoration:underline}
.iglink{
  font-family:"IBM Plex Mono",monospace; color:var(--brand); text-decoration:none;
  border-bottom:1px dashed rgba(95,178,236,.45); transition:color .15s ease, text-shadow .15s ease;
}
.iglink:hover{color:var(--brand-hi); border-bottom-style:solid; text-shadow:0 0 12px rgba(95,178,236,.7)}
.iglink::after{content:" ↗"; font-size:.8em; opacity:.6; border:0}

/* ---------- filters ---------- */
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center}
.filters input[type=text]{width:auto; min-width:180px; flex:1}
.filters select{width:auto}

/* ---------- charts ---------- */
.chartrow{display:grid; gap:10px}
.bar{display:grid; grid-template-columns:132px 1fr 54px; align-items:center; gap:10px; font-size:13px}
.bar .lab{color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar .tr{height:14px; background:var(--bar-track); border-radius:0 5px 5px 0; overflow:hidden;
  border:1px solid var(--line); border-left:0; box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.bar .tr i{display:block; height:100%; border-radius:0 5px 5px 0; min-width:2px;
  background:var(--grad-bar);
  box-shadow:0 0 12px rgba(95,178,236,.75), inset 0 1px 0 rgba(255,255,255,.3)}
.bar .v{text-align:right; font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink); font-variant-numeric:tabular-nums}
.bar.crit .tr i{background:linear-gradient(90deg,#A9463A 0%,#FF9280 60%,#FFC2B5 100%); box-shadow:0 0 12px rgba(255,146,128,.7), inset 0 1px 0 rgba(255,255,255,.28)}
.bar:hover .lab{color:var(--ink)}
@media (max-width:560px){.bar{grid-template-columns:96px 1fr 46px; gap:8px; font-size:12.5px}}

.funnel{display:flex; flex-direction:column; gap:2px}
.fstep{display:flex; align-items:center; gap:10px}
.fstep .fhere{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted); white-space:nowrap}
.fstep .fbar{
  display:flex; align-items:center; gap:10px; padding:10px 13px; border-radius:8px; min-width:104px; flex:none;
  background:linear-gradient(90deg, rgba(95,178,236,.32), rgba(95,178,236,.08));
  color:var(--brand-hi); box-shadow:inset 0 0 0 1px rgba(95,178,236,.28), 0 0 20px -10px rgba(95,178,236,.9);
}
.fstep .fbar .fn{font-family:"Archivo",sans-serif; font-weight:700; font-size:17px; font-variant-numeric:tabular-nums}
.fstep .fbar .fl{font-size:12.5px; font-weight:600; color:var(--ink-2)}
.fdrop{display:flex; align-items:center; gap:7px; padding:3px 12px; font-size:11.5px; color:var(--muted); font-family:"IBM Plex Mono",monospace}
.fdrop .pct{color:var(--ink-2); font-weight:500}
.fdrop.bad .pct{color:var(--crit)}
.fdrop.ok .pct{color:var(--good)}

.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{
  position:relative; overflow:hidden;
  background:linear-gradient(180deg, rgba(95,178,236,.06), rgba(255,255,255,0) 70%), var(--surface);
  border:1px solid var(--line); border-radius:var(--r); padding:15px 17px; box-shadow:var(--shadow);
}
.stat .k{font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.stat .v{
  font-family:"Archivo",sans-serif; font-weight:700; font-size:28px; letter-spacing:-.032em;
  margin-top:6px; font-variant-numeric:tabular-nums;
  color:var(--brand-hi); text-shadow:0 0 22px rgba(95,178,236,.5);
}
.stat .d{font-size:11.5px; color:var(--muted); margin-top:3px; font-family:"IBM Plex Mono",monospace}
.stat.good .v{color:var(--good)} .stat.crit .v{color:var(--crit)} .stat.warn .v{color:var(--warn)}
/* El cash es el único número que paga las cuentas: se ilumina en verde por dentro */
.stat.good{
  border-color:#2E7A57;
  background:linear-gradient(180deg, rgba(79,214,154,.10), rgba(79,214,154,.02) 70%), var(--surface);
  box-shadow:inset 0 0 26px -4px rgba(79,214,154,.45), inset 0 0 1px 1px rgba(79,214,154,.14), var(--shadow);
}
.stat.good::before{background:linear-gradient(90deg, transparent, rgba(79,214,154,.7) 25%, rgba(79,214,154,.7) 75%, transparent)}
.stat.good .k{color:#7FE0B4}
.stat.good .v{text-shadow:0 0 22px rgba(79,214,154,.6); font-variant-numeric:tabular-nums}

.formula{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted); letter-spacing:-.01em}

.verdict{border-left:3px solid var(--crit); background:var(--crit-soft); padding:14px 16px; border-radius:0 var(--r) var(--r) 0}
.verdict.ok{border-left-color:var(--good); background:var(--good-soft)}
.verdict .t{font-size:10.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; opacity:.75; margin-bottom:5px}
.verdict .m{font-family:"Archivo",sans-serif; font-weight:700; font-size:16.5px; line-height:1.32; letter-spacing:-.015em}
.verdict .s{font-size:13px; margin-top:6px; line-height:1.45; opacity:.9}
.verdict.crit{color:var(--crit)} .verdict.ok{color:var(--good)}

/* ---------- drawer ---------- */
.scrim{position:fixed; inset:0; background:rgba(3,6,10,.68); z-index:50; backdrop-filter:blur(4px)}
.drawer{
  position:fixed; z-index:51; background:var(--surface); box-shadow:var(--shadow);
  inset:auto 0 0 0; max-height:92vh; border-radius:14px 14px 0 0; display:flex; flex-direction:column;
}
@media (min-width:760px){
  .drawer{inset:0 0 0 auto; width:min(520px,100%); max-height:none; border-radius:0; border-left:1px solid var(--line)}
}
.drawer-head{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); flex:none}
.drawer-head h3{font-size:16px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.drawer-body{overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:16px}
.drawer-foot{display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); flex:none; background:var(--surface)}
.fieldset{display:flex; flex-direction:column; gap:11px}
.fieldset > .eyebrow{margin:0}
.steps{display:flex; gap:6px; flex-wrap:wrap}
.step{
  flex:1; min-width:74px; border:1px solid var(--line-2); background:var(--surface); border-radius:7px;
  padding:8px 6px; text-align:center; font-size:12px; font-weight:600; color:var(--muted); line-height:1.25;
}
.step small{display:block; font-weight:400; font-size:10.5px; opacity:.8; margin-top:2px}
.step[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.tl{display:flex; flex-direction:column; gap:8px; font-size:13px}
.tl .t{display:flex; gap:9px; align-items:flex-start}
.tl .d{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted); flex:none; padding-top:1px; width:52px}
.tl .n{color:var(--ink-2); line-height:1.4}

.toast{
  position:fixed; left:50%; bottom:calc(var(--nav-h) + 16px); transform:translateX(-50%);
  background:var(--surface-3); color:var(--ink); border:1px solid var(--accent-line); padding:10px 18px; border-radius:999px;
  font-size:13.5px; font-weight:500; z-index:80; box-shadow:var(--shadow), var(--glow-md); max-width:90vw; text-align:center;
}
@media (min-width:900px){.toast{bottom:20px}}

.helptext{font-size:12.5px; color:var(--muted); line-height:1.5}
.helptext code{font-family:"IBM Plex Mono",monospace; font-size:11.5px; background:var(--surface-2); padding:1px 4px; border-radius:3px}


/* ---------- login · pantalla partida ----------
   Solo esta pantalla usa el lenguaje visual de adsbyblitz.com: marca a la
   izquierda sobre la rejilla de puntos, formulario limpio a la derecha.
   El dashboard de dentro conserva la marca del cliente, no se toca.
   OJO: Padaloma solo trae a-z A-Z 0-9 y puntuacion basica — sin acentos.
   Por eso el wordmark va en Padaloma y todo el texto con tildes en Inter. */
@font-face{
  font-family:'Padaloma';
  src:url('/assets/padaloma.italic.ttf') format('truetype');
  font-weight:normal; font-style:italic; font-display:swap;
}
.gate{
  position:fixed; inset:0; z-index:200;
  display:grid; grid-template-columns:46% 54%;
  padding:0; background:#010205; overflow:hidden;
}

/* ---- panel de marca (izquierda) ---- */
.gate-brand{
  position:relative; overflow:hidden;
  border-right:1px solid rgba(255,255,255,.08);
  padding:56px 52px;
  display:flex; flex-direction:column; justify-content:space-between;
}
.gate-brand::before{           /* la misma rejilla de puntos que la web */
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(circle, rgba(255,255,255,.075) 1px, transparent 1px);
  background-size:30px 30px;
}
.gate-brand::after{            /* resplandor contenido, sale desde abajo */
  content:""; position:absolute; pointer-events:none;
  width:620px; height:620px; left:-240px; bottom:-280px;
  background:radial-gradient(circle, rgba(31,72,200,.32) 0%, rgba(31,72,200,.10) 42%, transparent 68%);
  filter:blur(50px);
}
.gate-eyebrow{
  position:relative; font-size:11px; font-weight:400;
  letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.38);
}
.gate-wordmark{
  position:relative; margin:0;
  font-family:'Padaloma', Georgia, serif; font-style:italic; font-weight:normal;
  font-size:clamp(34px,4.4vw,52px); line-height:1; letter-spacing:-.02em;
  text-transform:lowercase; color:#fff;
  background:none; -webkit-text-fill-color:#fff;
}
.gate-tag{
  position:relative; margin:16px 0 0; max-width:300px;
  font-size:13px; font-weight:300; line-height:1.65; color:rgba(255,255,255,.45);
}

/* ---- formulario (derecha) ---- */
.gate-card{
  display:flex; align-items:center; justify-content:center;
  padding:56px 48px; background:none; border:0; border-radius:0; box-shadow:none;
}
.gate-card::before{content:none}
.gate-fields{width:100%; max-width:330px}
.gate-card img{width:44px; height:44px; border-radius:50%; display:block; margin:0 0 28px}
.gate-card h1{
  font-size:15px; font-weight:500; letter-spacing:.01em; text-transform:none;
  color:#fff; margin:0 0 6px;
  background:none; -webkit-text-fill-color:#fff;
}
.gate-card .sub{
  display:block; margin:0 0 30px;
  font-size:13px; font-weight:300; line-height:1.6; color:rgba(255,255,255,.42);
}
.gate-card label{display:block; margin:0 0 18px}
.gate-card label .f{
  display:block; margin:0 0 9px;
  font-size:11px; font-weight:400; letter-spacing:.14em; text-transform:uppercase;
  color:rgba(255,255,255,.38);
}
.gate-card input{
  display:block; width:100%; box-sizing:border-box; height:48px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.14);
  border-radius:2px; padding:0 15px;
  color:#fff; font-family:inherit; font-size:14px; font-weight:300;
  outline:none; transition:border-color .25s, background .25s, box-shadow .25s;
}
.gate-card input::placeholder{color:rgba(255,255,255,.22)}
.gate-card input:focus{        /* mismo resplandor azul que la web, mas contenido */
  border-color:rgba(74,125,240,.75);
  background:rgba(31,72,200,.07);
  box-shadow:0 0 22px rgba(74,125,240,.30), inset 0 0 14px rgba(31,72,200,.14);
}
.gate-card #gBtn{
  display:flex; align-items:center; justify-content:center;
  width:100%; box-sizing:border-box; height:48px; margin:28px 0 0; padding:0;
  background:none; border:1px solid rgba(31,72,200,.8); border-radius:2px;
  color:#fff; font-family:inherit;
  font-size:12px; font-weight:500; letter-spacing:.1em; text-transform:uppercase;
  cursor:pointer; transition:background .25s, box-shadow .25s, border-color .25s;
  box-shadow:0 0 32px rgba(74,125,240,.28);        /* glow en reposo, como tus CTA */
}
.gate-card #gBtn:hover:not(:disabled){
  background:#1f48c8;
  box-shadow:0 0 56px rgba(74,125,240,.70), 0 0 20px rgba(74,125,240,.55);
}
.gate-card #gBtn:disabled{opacity:.5; cursor:default; box-shadow:none}
.gate-err{
  color:#ff6b6b; font-size:12.5px; font-weight:300; line-height:1.5;
  margin:18px 0 0; padding-top:18px; border-top:1px solid rgba(255,255,255,.08);
}

/* ---- movil: se apila, la marca pasa a ser cabecera ---- */
@media (max-width:820px){
  .gate{grid-template-columns:1fr; grid-template-rows:auto 1fr; overflow-y:auto}
  .gate-brand{
    border-right:0; border-bottom:1px solid rgba(255,255,255,.08);
    padding:40px 28px 34px; gap:14px;
  }
  .gate-brand .gate-eyebrow:last-child{display:none}
  .gate-brand::after{width:420px; height:420px; left:-160px; bottom:-220px}
  .gate-tag{max-width:none}
  .gate-card{padding:36px 28px 48px; align-items:flex-start}
  .gate-fields{max-width:420px; margin:0 auto}
}
.logout{margin-left:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>

<script>
"use strict";

/* El logo va incrustado como data URI: los artifacts no cargan imágenes externas */
const LOGO = (document.querySelector(".app") || {}).dataset
  ? document.querySelector(".app").dataset.logo : "";

/* ===================== constantes del negocio ===================== */
const BLOQUES = ["00 Apertura","01 Meta","02 Dolor","03 Filtro","04 Pre-call"];
const FUENTES = ["Bienvenida","Story reply","Comentario/Keyword","Referido","Inbound DM","Outbound DM"];
const OFERTAS = ["Foundation (3m)","System (6m)","Mastery (12m)","Select"];
const OBJECIONES = ["Dinero","Tiempo","Prioridad","Confianza en el proceso","Confianza en uno mismo",
  "Comparación","Decisión aplazada","Terceros","Adecuación al caso concreto","Urgencia baja","Otros"];

const DEFAULT_CFG = {
  metaToques: 20,        // leads trabajados por día
  metaAgendasSem: 3,     // agendas por semana
  goal: 50000, aov: 1250, closeRate: 0.30, showRate: 0.70, bookRate: 0.02, workDays: 22
};

/* ===================== utilidades de fecha ===================== */
const pad = n => String(n).padStart(2,"0");
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayStr(){ return iso(new Date()); }
function parseISO(s){ const p=String(s).split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function fmtShort(s){
  if(!s) return "—";
  const d=parseISO(s), m=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return d.getDate()+" "+m[d.getMonth()];
}
function fmtLong(s){
  const d=parseISO(s);
  const dias=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const m=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  return dias[d.getDay()]+", "+d.getDate()+" de "+m[d.getMonth()];
}
/* "Martes, Sep 8, 2026" */
function fmtLongDate(s){
  if(!s) return "—";
  const d = parseISO(s);
  const dias = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  const m = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  return dias[d.getDay()]+", "+m[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
}
/* "14:30" -> "2:30 PM" */
function fmtHora(h){
  const p = String(h||"").split(":");
  if(p.length < 2) return "";
  let H = parseInt(p[0], 10);
  if(isNaN(H)) return "";
  const ap = H >= 12 ? "PM" : "AM";
  H = H % 12; if(H === 0) H = 12;
  return H + ":" + p[1] + " " + ap;
}
/* Fecha y hora de la llamada, juntas */
function fmtCita(l){
  if(!l.agendo) return "—";
  const h = fmtHora(l.agendoHora);
  return fmtLongDate(l.agendo) + (h ? " · " + h : "");
}
/* El estado sale de los tags y de lo que registró el closer. Nadie lo escribe. */
function statusOf(l){
  if(l.cierre === true)  return {t:"Cliente", d:l.importe?("Pagó "+money(l.importe)):"Pagó · falta el importe", cls:"good"};
  if(l.show === false)   return {t:"No se presentó", d:"Se cayó la llamada del "+fmtLongDate(l.callDate), cls:"crit"};
  if(l.cierre === false) return {t:"No cerró", d:l.objecion?("Objeción: "+l.objecion):"Falta registrar la objeción", cls:"crit"};
  if(l.show === true)    return {t:"Vino a la llamada", d:"Falta saber si cerró", cls:"warn"};
  if(l.agendo)           return {t:"Agendó", d:"Llamada el "+fmtCita(l), cls:"cool"};
  if(l.pendingBook)      return {t:"Agendó", d:"Falta poner la fecha de la llamada", cls:"warn"};
  if(l.propuesta)        return {t:"Le mandaste el link", d:"Todavía no agenda", cls:"accent"};
  if(l.estado === "muerto") return {t:"No interesado", d:"Marcado en ManyChat", cls:""};
  if(l.via === "VSL")    return {t:"Vía VSL", d:"No va por llamada", cls:"warn"};
  if(l.respondio)        return {t:"Conversación viva", d:"Va por "+blockOf(l), cls:"accent"};
  return {t:"Sin contestar", d:"Todavía no hay conversación", cls:""};
}
/* Lo reciente se lee mejor en palabras; lo viejo, con fecha.
   El día de la semana ayuda a ubicarse dentro de la semana en curso. */
function entryLabel(s){
  if(!s) return "sin fecha";
  const n = daysBetween(s, todayStr());
  if(n <= 0) return "hoy";
  if(n === 1) return "ayer";
  if(n < 7){
    const dias = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
    return "el " + dias[parseISO(s).getDay()];
  }
  return "el " + fmtShort(s);
}
function entryTitle(s, exacto){
  if(!s) return "Sin fecha de entrada";
  const n = daysBetween(s, todayStr());
  let t = fmtLongDate(s) + (n > 1 ? " · hace " + n + " días" : "");
  /* Si ManyChat nos dio el momento exacto de la suscripción, enséñalo */
  if(exacto){
    const m = String(exacto).match(/(\d{1,2}):(\d{2})/);
    if(m) t += " · se suscribió a las " + fmtHora(m[1].padStart(2,"0") + ":" + m[2]);
  }
  return t;
}
function agoLabel(s){
  if(!s) return "sin toques";
  const n = daysBetween(s, todayStr());
  if(n<=0) return "hoy";
  if(n===1) return "ayer";
  return "hace "+n+" días";
}
const money = n => "$"+Math.round(+n||0).toLocaleString("en-US");
/* El cash del mes va con centavos: es plata cobrada, no una estimación */
const money2 = n => "$"+(+n||0).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
const pct = (n,d) => d>0 ? Math.round(n/d*1000)/10 : null;
const pctStr = v => v===null ? "—" : v.toFixed(v>=10?0:1).replace(".0","")+"%";
function uid(){ return "l"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = h => String(h||"").trim().replace(/^@+/,"").toLowerCase();

/* ===================== estado ===================== */

/* ===================== lead ===================== */
function blankLead(){
  return {
    id: uid(), handle:"", nombre:"", fuente:"Bienvenida", entry: todayStr(),

    seed:false, via:"", pendingBook:false, tags:[], touchedAt:null,

function stage(l){
  if(l.cierre===true) return 6;
  if(l.show===true) return 5;
  if(l.agendo) return 4;
  if(l.propuesta) return 3;
  if(l.respondio) return 2;
  return 1;
}
/* El bloque NO se escribe: se deduce de lo que el setter ya anotó.
   Nunca baja, solo sube. `blockFloor` es el piso que trajeron los tags de ManyChat.
   Con `blockLock` el setter lo fija a mano y deja de moverse. */
function blockIdx(l){
  if(l.blockLock){ const i = BLOQUES.indexOf(l.block); return i < 0 ? 0 : i; }
  let i = 0;
  if(l.blockFloor){ const f = BLOQUES.indexOf(l.blockFloor); if(f > i) i = f; }
  if(String(l.meta   || "").trim()) i = Math.max(i, 1);
  if(String(l.dolor  || "").trim()) i = Math.max(i, 2);
  if(String(l.yaHace || "").trim()) i = Math.max(i, 3);
  if(l.propuesta || l.agendo || l.pendingBook) i = Math.max(i, 4);
  return i;
}
function blockOf(l){ return BLOQUES[blockIdx(l)]; }

/* ===================== persistencia ===================== */
const LS_LEADS = "blueprint_leads_v1", LS_CFG = "blueprint_cfg_v1", LS_ROLE = "blueprint_role_v1", LS_MAN = "blueprint_manual_v1";

function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_LEADS);
    LEADS = raw ? JSON.parse(raw) : [];
    const c = localStorage.getItem(LS_CFG);
    if(c) CFG = Object.assign({}, DEFAULT_CFG, JSON.parse(c));
    const m = localStorage.getItem(LS_MAN);
    if(m) TOUCHMAN = JSON.parse(m) || {};
  }catch(e){ LEADS = []; }
}
function saveLocal(){
  try{
    localStorage.setItem(LS_LEADS, JSON.stringify(LEADS));
    localStorage.setItem(LS_CFG, JSON.stringify(CFG));
    localStorage.setItem(LS_MAN, JSON.stringify(TOUCHMAN));
  }catch(e){ toast("No se pudo guardar en este navegador."); }
}

async function persist(lead){
  lead.updatedAt = new Date().toISOString();
  /* Un toque es una conversación del setter. Que el closer registre un cierre
     no es un toque suyo, así que no infla el contador del día. */
  if(ROLE === "setter") lead.touchedAt = todayStr();
  const i = LEADS.findIndex(l => l.id === lead.id);
  if(i < 0) LEADS.push(lead); else LEADS[i] = lead;
  render();
  if(MODE === "demo") return;
  if(MODE === "db"){
    try{ await DB.collection("leads").doc(lead.id).set(lead); }
    catch(e){ toast(dbMsg(e)); }
  } else saveLocal();
}
async function persistMany(list){
  list.forEach(lead => {
    lead.updatedAt = new Date().toISOString();
    const i = LEADS.findIndex(l => l.id === lead.id);
    if(i < 0) LEADS.push(lead); else LEADS[i] = lead;
  });
  render();
  if(MODE === "demo") return;
  if(MODE === "db"){
    for(const lead of list){
      try{ await DB.collection("leads").doc(lead.id).set(lead); }
      catch(e){ toast(dbMsg(e)); break; }
    }
  } else saveLocal();
}
async function removeLead(id){
  LEADS = LEADS.filter(l => l.id !== id);
  render();
  if(MODE === "demo") return;
  if(MODE === "db"){ try{ await DB.collection("leads").doc(id).delete(); }catch(e){ toast(dbMsg(e)); } }
  else saveLocal();
}
async function persistMan(){
  render();
  if(MODE === "demo") return;
  if(MODE === "db"){ try{ await DB.doc("metrics/manual").set({ dias:TOUCHMAN }); }catch(e){ toast(dbMsg(e)); } }
  else saveLocal();
}
/* Un toque es una conversación, no un lead. Puede ser cualquier @handle. */
async function registrarToque(handle){
  const h = norm(handle);
  if(!h) return { ok:false, msg:"Escribe un @handle." };
  const T = todayStr();
  const lead = LEADS.find(l => norm(l.handle) === h);
  if(lead){
    if(lead.touchedAt === T) return { ok:false, msg:"@"+h+" ya cuenta como toque de hoy." };
    lead.touchedAt = T;
    await persist(lead);
    return { ok:true, msg:"@"+h+" registrado. Ya estaba en el CRM." };
  }
  const hoy = manualEn(T);
  if(hoy.map(norm).indexOf(h) >= 0) return { ok:false, msg:"@"+h+" ya cuenta como toque de hoy." };
  TOUCHMAN = Object.assign({}, TOUCHMAN); TOUCHMAN[T] = hoy.concat([h]);
  await persistMan();
  return { ok:true, msg:"@"+h+" registrado como toque." };
}
async function persistCfg(){
  render();
  if(MODE === "demo") return;
  if(MODE === "db"){ try{ await DB.doc("config/settings").set(CFG); }catch(e){ toast(dbMsg(e)); } }
  else saveLocal();
}
function dbMsg(e){
  const c = e && e.code;
  if(c === "quota_exceeded") return "La base de datos está llena. Borra leads viejos para seguir añadiendo.";
  if(c === "resource_exhausted") return "Vas muy rápido. Espera unos segundos y vuelve a intentar.";
  if(c === "revoked" || c === "not_granted") return "Perdiste el acceso a los datos. Recarga la página.";
  if(c === "invalid_argument") return "Ese dato no se pudo guardar. Revisa el formulario.";
  return "No se pudo guardar. Intenta otra vez.";
}

}

function markRespondio(lead){

/* ===================== métricas ===================== */
function windowFrom(days){ return days === 0 ? "0000-01-01" : addDays(todayStr(), -(days-1)); }
/* Leads que corrieron el embudo dentro de la app (sin el arrastre importado) */
function REAL(){ return LEADS.filter(l => !l.seed); }
function seedCount(){ return LEADS.filter(l => l.seed).length; }

function metrics(days, countBy){
  const from = windowFrom(days), to = todayStr(), T = todayStr();
  const inW = d => !!d && d >= from && d <= to;
  const m = { leads:0, resp:0, prop:0, agen:0, callsDone:0, shows:0, cierres:0, cash:0, pendReg:0, futuras:0 };
  const TODOS = LEADS;

  if(countBy === "cohorte"){
    /* Cohorte agrupa por fecha de entrada, y la del arrastre es la de importación —
       inventada. Por eso el arrastre queda fuera de este modo por completo. */
    const LEADS = REAL();
    const set = LEADS.filter(l => inW(l.entry));
    m.leads = set.length;
    m.resp = set.filter(l => l.respondio).length;
    m.prop = set.filter(l => l.propuesta).length;
    m.agen = set.filter(l => !!l.agendo).length;
    const done = set.filter(l => l.callDate && l.callDate <= T);
    m.callsDone = done.filter(l => l.show !== null).length;
    m.pendReg   = done.filter(l => l.show === null).length;
    m.futuras   = set.filter(l => l.callDate && l.callDate > T).length;
    m.shows   = set.filter(l => l.show === true).length;
    m.cierres = set.filter(l => l.cierre === true).length;
    m.cash    = set.filter(l => l.cierre === true).reduce((a,l) => a + (+l.importe||0), 0);
  } else {
    /* Actividad cuenta cada evento por SU propia fecha. El arrastre entra aquí:
       lo que le pase de hoy en adelante tiene fecha real y sí cuenta. Sus fechas
       viejas están en null, así que se excluyen solas. La única excepción es
       `leads`, que sale de `entry` — y esa sí es inventada para el arrastre. */
    m.leads = REAL().filter(l => inW(l.entry)).length;
    m.resp  = TODOS.filter(l => inW(l.respondioAt)).length;
    m.prop  = TODOS.filter(l => inW(l.propuestaAt)).length;
    m.agen  = TODOS.filter(l => inW(l.agendoAt)).length;
    const done = TODOS.filter(l => l.callDate && inW(l.callDate) && l.callDate <= T);
    m.callsDone = done.filter(l => l.show !== null).length;
    m.pendReg   = done.filter(l => l.show === null).length;
    m.futuras   = TODOS.filter(l => l.callDate && l.callDate > T).length;
    m.shows   = TODOS.filter(l => l.show === true && inW(l.showAt)).length;
    m.cierres = TODOS.filter(l => l.cierre === true && inW(l.cierreAt)).length;
    m.cash    = TODOS.filter(l => l.cierre === true && inW(l.cierreAt)).reduce((a,l) => a + (+l.importe||0), 0);
  }
  m.rResp  = pct(m.resp, m.leads);
  m.rProp  = pct(m.prop, m.resp);
  m.rAgen  = pct(m.agen, m.prop);
  m.rBook  = pct(m.agen, m.leads);
  m.rShow  = pct(m.shows, m.callsDone);
  m.rClose = pct(m.cierres, m.shows);
  m.aov    = m.cierres > 0 ? m.cash / m.cierres : null;
  return m;
}

function agendasOn(day){ return LEADS.filter(l => l.agendoAt === day).length; }
/* Semana de lunes a domingo */
function weekStart(s){
  const d = parseISO(s), off = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - off);
  return iso(d);
}
function agendasSemana(){
  const w = weekStart(todayStr());
  return LEADS.filter(l => l.agendoAt && l.agendoAt >= w).length;
}
/* Un toque = cualquier interacción por DM, sea lead o no.
   La cuenta buena viene del log de ManyChat (Daily Touch), que la sincronización
   resume en `metrics/touches`. Los toques hechos dentro de la app son el respaldo
   mientras la sincronización no ha corrido hoy. */
/* Si ManyChat está en otra zona horaria, un toque de las 9pm en Puerto Rico se
   graba con la fecha de MAÑANA. No se puede adivinar el offset, pero sí se puede
   detectar: si hay conteos con fecha futura, algo está corrido. */
function toquesFuturos(){
  const src = (TOUCHDAYS && TOUCHDAYS.dias && typeof TOUCHDAYS.dias === "object") ? TOUCHDAYS.dias : (TOUCHDAYS || {});
  const T = todayStr();
  return Object.keys(src).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d) && d > T && Number(src[d]) > 0).sort();
}
function manualEn(dia){
  const arr = (TOUCHMAN && TOUCHMAN[dia]) || [];
  return Array.isArray(arr) ? arr : [];
}
function toquesEn(dia){
  /* Tolera las dos formas en que la sincronización puede guardarlo:
     {"2026-09-07":18}  o  {dias:{"2026-09-07":18}} */
  const src = (TOUCHDAYS && TOUCHDAYS.dias && typeof TOUCHDAYS.dias === "object") ? TOUCHDAYS.dias : (TOUCHDAYS || {});
  const log = Number(src[dia] || 0);
  const tocados = LEADS.filter(l => l.touchedAt === dia).map(l => norm(l.handle));
  /* ManyChat y la app ven a la misma gente, así que ahí se toma el mayor, no la
     suma. Los de a mano son justamente los que ManyChat NO puede ver, así que
     esos sí suman — descontando a los que ya cuentan como lead trabajado. */
  const man = manualEn(dia).filter(h => tocados.indexOf(norm(h)) < 0).length;
  return Math.max(log, tocados.length) + man;
}
function toquesHoy(){ return toquesEn(todayStr()); }

function bottleneck(m){
  const b = [];
  if(m.leads >= 20) b.push({k:"book",  lab:"BOOK RATE", real:m.rBook,  bench:CFG.bookRate*100,  n:m.leads,
    msg:"El problema está en el DM. De cada 100 conversaciones estás agendando "+ (m.rBook===null?"0":m.rBook) +", y el benchmark es "+(CFG.bookRate*100)+".",
    fix:"Mira la sección Dónde se mueren: el bloque con más gente atascada es el guion que hay que cambiar."});
  if(m.callsDone >= 8) b.push({k:"show", lab:"SHOW RATE", real:m.rShow, bench:CFG.showRate*100, n:m.callsDone,
    msg:"Agendan y no se presentan. Show rate en "+pctStr(m.rShow)+" contra un benchmark de "+(CFG.showRate*100)+"%.",
    fix:"El problema es el pre-call: recordatorio el día antes y la mañana de, y agendar más cerca de la fecha."});
  if(m.shows >= 8) b.push({k:"close", lab:"CIERRE", real:m.rClose, bench:CFG.closeRate*100, n:m.shows,
    msg:"Llegan a la llamada y no cierran. Close rate en "+pctStr(m.rClose)+" contra un benchmark de "+(CFG.closeRate*100)+"%.",
    fix:"No es problema de leads, es de la llamada. Mira qué objeción se repite más abajo."});
  const failing = b.filter(x => x.real !== null && x.real < x.bench)
                   .sort((a,b2) => (a.real/a.bench) - (b2.real/b2.bench));
  if(!b.length) return {none:true, msg:"Todavía no hay suficiente data en este período para decir dónde está el cuello de botella.",
    fix:"Hacen falta al menos 20 leads para juzgar el book rate, 8 llamadas para el show rate y 8 shows para el cierre."};
  if(!failing.length) return {ok:true, lab:"NINGUNO", msg:"Las tres tasas están en o sobre el benchmark. El límite ahora es volumen, no conversión.",
    fix:"Sube toques por día — la conversión ya está donde tiene que estar."};
  return failing[0];
}

function byBlock(){
  const alive = LEADS.filter(l => l.cierre !== true && l.estado !== "muerto");
  return BLOQUES.map((b,i) => ({ lab:b, n: alive.filter(l => blockIdx(l) === i).length }));
}
function byObjection(){
  const perdidos = LEADS.filter(l => l.show === true && l.cierre === false && l.objecion);
  const map = {};
  perdidos.forEach(l => { map[l.objecion] = (map[l.objecion]||0)+1; });
  return Object.keys(map).map(k => ({lab:k, n:map[k]})).sort((a,b) => b.n - a.n);
}
function bySource(){
  const LEADS = REAL();
  return FUENTES.map(f => {
    const set = LEADS.filter(l => l.fuente === f);
    const cierres = set.filter(l => l.cierre === true);
    return { lab:f, leads:set.length, agen:set.filter(l => !!l.agendo).length,
      cierres:cierres.length, cash:cierres.reduce((a,l) => a + (+l.importe||0), 0) };
  }).filter(r => r.leads > 0).sort((a,b) => b.cash - a.cash || b.leads - a.leads);
}

function goalMath(){
  const c = CFG;
  const cierres = c.aov > 0 ? c.goal / c.aov : 0;
  const llamadas = c.closeRate > 0 ? cierres / c.closeRate : 0;
  const agendas = c.showRate > 0 ? llamadas / c.showRate : 0;
  const leads = c.bookRate > 0 ? agendas / c.bookRate : 0;
  const dias = c.workDays > 0 ? c.workDays : 1;
  return { cierres, llamadas, agendas, leads,
    agendasDia: agendas/dias, agendasSem: agendas/4.3, leadsDia: leads/dias,
    gapAgendas: c.metaAgendasSem > 0 ? (agendas/4.3)/c.metaAgendasSem : null };
}

/* ===================== colas ===================== */
/* Sin fecha de seguimiento: la cola se ordena por dónde está cada quien en el embudo.
   Los más avanzados primero, que son los que más cerca están de agendar. */
function queues(){
  const T = todayStr();
  const active = LEADS.filter(l => l.estado === "activo" && l.cierre !== true);
  const pendientes = active.filter(l => l.pendingBook && !l.callDate);
  const agendados  = active.filter(l => !l.pendingBook && l.agendo && l.agendo >= T);
  const espera     = new Set(pendientes.concat(agendados).map(l => l.id));
  const pool       = active.filter(l => !espera.has(l.id));
  const porBloque = BLOQUES.map((b,i) => ({
    lab: b, i,
    list: pool.filter(l => blockIdx(l) === i).sort((a,b2) => (a.entry||"") < (b2.entry||"") ? -1 : 1)
  })).reverse();
  return { pendientes, agendados, porBloque, total: pool.length };
}
/* Las tres notas son la munición del closer. Si falta UNA sola, se avisa:
   entrar a una llamada sin saber la meta, o sin el dolor, o sin qué ya intentó,
   es entrar cojo. Aplica desde que hay fecha, con o sin hora. */
const MUNICION = [
  {k:"meta",   lab:"meta"},
  {k:"dolor",  lab:"dolor"},
  {k:"yaHace", lab:"ya hace"}
];
function municionFaltante(l){
  if(!l.callDate) return [];
  if(l.show !== null) return [];          /* la llamada ya pasó y se registró */
  return MUNICION.filter(m => !String(l[m.k]||"").trim()).map(m => m.lab);
}
function faltaMunicion(l){ return municionFaltante(l).length > 0; }
function callQueue(){
  const T = todayStr();
  const asc = (a,b) => (a.callDate||"") < (b.callDate||"") ? -1 : 1;
  const desc = (a,b) => (a.callDate||"") > (b.callDate||"") ? -1 : 1;
  return {
    /* falta la fecha de la llamada */
    sinFecha:     LEADS.filter(l => l.pendingBook && !l.callDate),
    /* CONFIRMADAS: fecha Y hora, todavía sin resultado. Es la cola del closer. */
    proximas:     LEADS.filter(l => l.callDate && l.callDate >= T && l.show === null && !!l.agendoHora).sort(asc),
    /* tienen día pero nadie puso la hora */
    sinHora:      LEADS.filter(l => l.callDate && l.callDate >= T && l.show === null && !l.agendoHora).sort(asc),
    /* ya pasó el día y nadie dijo si vino */
    porRegistrar: LEADS.filter(l => l.callDate && l.callDate < T && l.show === null).sort(asc),
    /* vino: falta decir si cerró, o cerró y falta el dinero — todo en una fila */
    porResultado: LEADS.filter(l => l.show === true &&
                    (l.cierre === null || (l.cierre === true && !(+l.importe > 0)))).sort(asc),
    /* vino, falta decir si cerró */
    porCerrar:    LEADS.filter(l => l.show === true && l.cierre === null).sort(asc),
    /* cerró, falta el dinero */
    sinImporte:   LEADS.filter(l => l.cierre === true && !(+l.importe > 0)).sort(desc),
    /* todavía no pasa */
    porVenir:     LEADS.filter(l => l.callDate && l.callDate > T).sort(asc),
    /* cerradas — con o sin el importe puesto */
    cerradas:     LEADS.filter(l => l.cierre === true).sort(desc),
    /* no cerraron — no compró, o ni se presentó */
    noCerraron:   LEADS.filter(l => l.cierre === false || l.show === false).sort(desc),
    /* completadas (se mantiene para las tasas) */
    hechas:       LEADS.filter(l => l.show === false || (l.cierre !== null && (+l.importe > 0 || l.cierre === false))).sort(desc)
  };
}

  }).join("");
  document.getElementById("rail").innerHTML =
    '<div class="rail-brand"><img src="'+LOGO+'" alt=""><b>Blueprint</b><span>CRM</span></div>' +
    navs().map(n => {
      const c = counts[n.k];
      return '<button class="railbtn" data-nav="'+n.k+'"'+(VIEW===n.k?' aria-current="page"':'')+'>'+ICON[n.icon]+
        '<span>'+n.lab+'</span>'+(c?'<span class="cnt num">'+c+'</span>':"")+'</button>';
    }).join("");
  const d = parseISO(todayStr());
  const dd = ["dom","lun","mar","mié","jue","vie","sáb"][d.getDay()];
  const mm = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][d.getMonth()];
  document.getElementById("topDate").textContent = dd+" "+d.getDate()+" "+mm;
  const bl = document.getElementById("brandLogo");
  if(bl && !bl.src && LOGO) bl.src = LOGO;
  document.querySelectorAll("#roleSwitch button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.role === ROLE)));
}

function modeBanner(){
  if(MODE === "demo") return '<div class="banner"><p><b>Modo ejemplo.</b> Estos 10 leads son inventados para que veas cómo funciona — nada de lo que hagas aquí se guarda.</p><span class="spacer"></span><button class="btn sm" data-act="startFresh">Empezar de cero</button></div>';
  if(MODE === "local") return '<div class="banner"><p><b>Guardando solo en este navegador.</b> No pude conectar con la base de datos compartida, así que tu cliente no ve estos datos y se pierden si borras el historial.</p></div>';
  return "";
}

/* ===================== render: HOY ===================== */
function stepDots(l){
  const s = stage(l);
  return '<span class="stepdots" title="'+["","Abierto","Respondió","Propuesta","Agendó","Show","Cerró"][s]+'">' +
    [1,2,3,4].map(i => '<i class="'+(s>i?"on":"")+'"></i>').join("") + '</span>';
}
function blockChip(l){
  const i = blockIdx(l);
  return '<span class="chip b'+i+'"'+(l.blockLock?' title="Fijado a mano"':'')+'>'+esc(BLOQUES[i])+(l.blockLock?' ·':'')+'</span>';
}
function rowHTML(l, variant){
  const cls = variant === "booked" ? "booked" : variant === "late" ? "late" : "";
  let meta = "";
  if(variant === "booked"){
    meta = '<span class="chip cool">'+fmtCita(l)+'</span>';
    const falta = municionFaltante(l);
    if(falta.length) meta += '<span class="chip crit" title="El closer entra sin esto">falta: '+esc(falta.join(", "))+'</span>';
  }
  if(l.via === "VSL") meta += '<span class="chip b2">VSL</span>';
  if(l.seed) meta += '<span class="chip" title="Entró en la importación inicial. No se sabe cuánto tardó en cada paso, así que no cuenta en las tasas de cohorte.">sin historial</span>';
  const notas = [l.meta && "meta", l.dolor && "dolor", l.yaHace && "ya hace"].filter(Boolean);
  const notaChip = notas.length
    ? '<span class="chip good" title="Notas escritas">'+notas.join(" · ")+'</span>'
    : '<span class="chip warn" title="Sin nada anotado">sin notas</span>';
  /* El tag más avanzado de ManyChat, que es info distinta al bloque */
  const topTag = (l.tags && l.tags.length)
    ? l.tags.slice().sort((a,b) => etapaRank(guessStage(b)) - etapaRank(guessStage(a)))[0] : "";
  const tagChip = topTag ? '<span class="chip cool" title="Tag en ManyChat">'+esc(tagName(topTag))+'</span>' : "";
  return '<div class="row '+cls+'">' +
    '<button class="row-main" data-open="'+l.id+'">' +
      '<span class="row-l1"><span class="h">@'+esc(l.handle)+'</span>'+(l.nombre && norm(l.nombre)!==norm(l.handle)?'<span class="n">'+esc(l.nombre)+'</span>':"")+'</span>' +
      '<span class="row-l2">'+stepDots(l)+tagChip+notaChip+'<span title="'+esc(entryTitle(l.entry, l.subscribedAt))+'">entró '+entryLabel(l.entry)+'</span>'+meta+'</span>' +
    '</button>' +
    '<span class="row-acts"><button class="btn sm ghost" data-open="'+l.id+'">Abrir</button></span>' +
  '</div>';
}
function group(title, list, variant, hint){
  if(!list.length) return "";
  return '<section class="qgroup"><div class="qhead"><h3>'+title+'</h3><span class="n">'+list.length+'</span><span class="rule"></span></div>' +
    (hint ? '<p class="helptext" style="margin:-4px 0 9px">'+hint+'</p>' : "") +
    '<div class="rows">'+list.map(l => rowHTML(l, variant)).join("")+'</div></section>';
}

/* Los dos números que se manejan a diario. Salen en Hoy y arriba de Números. */
function metersHTML(){
  const T = todayStr();
  const t = toquesHoy(), mt = CFG.metaToques || 1;
  const a = agendasSemana(), ma = CFG.metaAgendasSem || 1;
  const nuevos = LEADS.filter(l => l.entry === T && !l.seed).length;
  const dias = ["dom","lun","mar","mié","jue","vie","sáb"];
  const wd = weekStart(T);
  const meter = (lab, sub, val, meta, pct, ok, extra) =>
    '<div class="meter"><div class="meter-top"><span class="lab">'+lab+'</span>' +
      '<span class="val num">'+val+'<small>/'+meta+'</small></span></div>' +
      '<div class="track"><i class="'+(ok?"done":"")+'" style="width:'+pct+'%"></i></div>' +
      '<p class="helptext" style="margin-top:7px">'+sub+'</p>'+(extra||"")+'</div>';
  /* ManyChat no puede tocar a quien no sigue la cuenta o tiene la ventana cerrada.
     Esos toques son reales, así que se anotan aquí a mano. */
  const man = manualEn(T);
  const addBox = ROLE !== "setter" ? "" :
    '<div class="touchadd">' +
      '<input type="text" id="tqHandle" placeholder="@handle que tocaste" class="mono" autocomplete="off">' +
      '<button class="btn sm primary" data-act="addToque">+ toque</button>' +
    '</div>' +
    (man.length ? '<p class="helptext" style="margin-top:8px">A mano hoy: ' +
      man.map(h => '<span class="chip">@'+esc(h)+'</span>').join(" ") + '</p>' : "");
  return '<div class="meters">' +
    meter("Toques hoy", "Conversaciones que tocaste hoy" + (nuevos ? " · "+nuevos+" leads nuevos" : ""),
          t, mt, Math.min(100, t/mt*100), t >= mt, addBox) +
    meter("Agendas esta semana", "Desde el "+dias[parseISO(wd).getDay()]+" "+fmtShort(wd),
          a, ma, Math.min(100, a/ma*100), a >= ma) +
  '</div>';
}

function viewHoy(){
  const q = queues();
  const meters = metersHTML();
  /* Toques fechados en el futuro = la zona horaria de ManyChat no es la tuya. */
  const fut = toquesFuturos();
  const avisoTz = fut.length ? '<div class="banner"><p><b>Hay toques con fecha futura ('+esc(fut.join(", "))+').</b> ' +
    'Eso pasa cuando la zona horaria de tu cuenta de ManyChat no es la de Puerto Rico: un toque de la noche se graba con la fecha de mañana. ' +
    'Revísalo en ManyChat → Settings → Time Zone.</p></div>' : "";
  /* Lo que el closer va a necesitar y todavía no está escrito. */
  const ciegas = LEADS.filter(l => municionFaltante(l).length);
  const alerta = ciegas.length ? '<div class="banner crit"><p><b>' +
    (ciegas.length === 1 ? 'Una llamada agendada va incompleta.' : ciegas.length+' llamadas agendadas van incompletas.') +
    '</b> El closer necesita meta, dolor y qué ya hace. Ábrelas y escribe lo que te dijeron: ' +
    ciegas.map(l => '@'+esc(l.handle)+' <span style="opacity:.75">(falta '+esc(municionFaltante(l).join(", "))+')</span>').join(" · ") +
    '</p></div>' : "";
  let body = "";
  if(!LEADS.length){
    body = '<div class="card empty"><h3>Todavía no hay leads</h3><p>La sincronización de ManyChat los trae cada mañana. También puedes importar el CSV del Sheet.</p>' +
      '<button class="btn primary" data-nav="importar">Ir a Importar</button></div>';
  } else if(q.total === 0){
    body = '<div class="card empty"><h3>Nadie en la cola</h3><p>Todos los activos están agendados o cerrados.</p></div>';
  } else {
    const hints = {
      4:"Ya tienen el link. Estos son los que están a un paso.",
      3:"Ya sabes qué hacen. Falta llevarlos al link.",
      2:"Te soltaron el dolor. Falta el filtro.",
      1:"Te dijeron la meta. Falta el dolor.",
      0:"Hablaste con ellos y todavía no anotaste nada. Aquí es donde está el trabajo."
    };
    body = q.porBloque.filter(g => g.list.length)
      .map(g => group(g.lab, g.list, "", hints[g.i])).join("");
  }
  const faltanFechas = sinFechaGroup(q.pendientes);
  const extra = group("Llamada agendada", q.agendados, "booked", "Ya no son tuyos hasta la llamada.");

  return modeBanner() + '<div class="section">' + meters + avisoTz + alerta + faltanFechas + body + extra + '</div>';
}

/* ===================== render: LEADS ===================== */
function viewLeads(){
  const f = FILTERS;
  let list = LEADS.slice();
  if(f.estado === "activo") list = list.filter(l => l.estado === "activo" && l.cierre !== true);
  else if(f.estado === "cliente") list = list.filter(l => l.cierre === true);
  else if(f.estado === "muerto") list = list.filter(l => l.estado === "muerto");
  if(f.fuente) list = list.filter(l => l.fuente === f.fuente);
  if(f.bloque) list = list.filter(l => blockOf(l) === f.bloque);
  if(f.q){
    const s = f.q.toLowerCase();
    list = list.filter(l => (l.handle+" "+l.nombre+" "+l.meta+" "+l.dolor).toLowerCase().includes(s));
  }
  list.sort((a,b) => (b.entry||"") < (a.entry||"") ? -1 : 1);

  const opts = (arr, sel) => '<option value="">Todos</option>' + arr.map(o => '<option'+(o===sel?' selected':'')+'>'+esc(o)+'</option>').join("");

  const filters =
    '<div class="filters">' +
      '<input type="text" id="fq" placeholder="Buscar handle, nombre, meta o dolor…" value="'+esc(f.q)+'">' +
      '<select id="festado"><option value="activo"'+(f.estado==="activo"?" selected":"")+'>Activos</option>' +
        '<option value="cliente"'+(f.estado==="cliente"?" selected":"")+'>Clientes</option>' +
        '<option value="muerto"'+(f.estado==="muerto"?" selected":"")+'>Muertos</option>' +
        '<option value=""'+(f.estado===""?" selected":"")+'>Todos</option></select>' +
      '<select id="ffuente">'+opts(FUENTES, f.fuente)+'</select>' +
      '<select id="fbloque">'+opts(BLOQUES, f.bloque)+'</select>' +
      '<button class="btn" data-nav="exportar">Exportar</button>' +
    '</div>';

  if(!list.length){
    return modeBanner() + '<div class="section"><div class="h-row"><h2>Leads</h2><span class="sub">'+LEADS.length+' en total</span></div>' +
      filters + '<div class="card empty"><h3>Nada con ese filtro</h3><p>Cambia la búsqueda o los filtros de arriba.</p></div></div>';
  }

  const rows = list.map(l => {
    const s = statusOf(l);
    const cc = s.cls === "good" ? "good" : s.cls === "crit" ? "crit" : s.cls === "cool" ? "cool" : "";
    const notas = [l.meta && "meta", l.dolor && "dolor", l.yaHace && "ya hace"].filter(Boolean);
    return '<tr><td><button class="linkish" data-open="'+l.id+'">@'+esc(l.handle)+'</button></td>' +
      '<td>'+esc(l.nombre||"—")+'</td><td>'+esc(l.fuente)+'</td><td>'+blockChip(l)+'</td>' +
      '<td><span class="chip '+cc+'">'+esc(s.t)+'</span></td>' +
      '<td class="mono" title="'+esc(entryTitle(l.entry, l.subscribedAt))+'">'+fmtShort(l.entry)+'</td>' +
      '<td>'+(notas.length?esc(notas.join(" · ")):'<span style="color:var(--warn)">sin notas</span>')+'</td>' +
      '<td class="mono">'+(l.agendo?fmtShort(l.agendo):"—")+'</td>' +
      '<td class="r mono">'+(l.importe?money(l.importe):"—")+'</td></tr>';
  }).join("");

  return modeBanner() + '<div class="section">' +
    '<div class="h-row"><h2>Leads</h2><span class="sub">'+list.length+' de '+LEADS.length+'</span></div>' + filters +
    '<div class="tablewrap"><table><thead><tr><th>Handle</th><th>Nombre</th><th>Fuente</th><th>Bloque</th><th>Estado</th>' +
    '<th>Entró</th><th>Notas</th><th>Llamada</th><th class="r">Importe</th></tr></thead><tbody>' +
    rows + '</tbody></table></div></div>';
}

/* ===================== render: LLAMADAS ===================== */
/* El closer decide en un solo paso, y los botones están siempre a la vista:
   verde cierra, rojo no cierra, Ver abre la ficha (ahí adentro está "no vino",
   que es un caso raro y no merece un botón en la tarjeta). */
function resultadoBtns(l){
  return '<button class="btn sm good" data-close="'+l.id+'|1">Cerró</button>' +
         '<button class="btn sm crit" data-close="'+l.id+'|0">No cerró</button>' +
         '<button class="btn sm ghost" data-open="'+l.id+'">Ver</button>';
}
function callRow(l, kind){
  const when = l.agendo ? fmtCita(l) : (l.callDate ? fmtLongDate(l.callDate) : "sin fecha");
  let right = "", tone = "done", tags = "";

  if(kind === "reg"){
    tone = "late";
    right = resultadoBtns(l);
  } else if(kind === "cerrada"){
    tone = "done";
    tags = '<span class="chip good">Cerró</span>';
    right = (+l.importe > 0)
      ? '<span class="chip good">'+money2(l.importe)+'</span>' +
        '<button class="btn sm ghost" data-open="'+l.id+'">Editar</button>'
      : '<span class="amountbox">' +
        '<input type="number" data-amount="'+l.id+'" placeholder="¿Cuánto?" min="0" step="25" inputmode="decimal" class="mono">' +
        '<button class="btn sm primary" data-saveamount="'+l.id+'">Guardar</button>' +
        '<button class="btn sm ghost" data-close="'+l.id+'|x" title="Deshacer">↩</button></span>';
  } else if(kind === "nocerro"){
    tone = "done";
    tags = l.show === false
      ? '<span class="chip crit">No vino</span>'
      : '<span class="chip">No cerró'+(l.objecion?" · "+esc(l.objecion):" · falta la objeción")+'</span>';
    right = '<button class="btn sm ghost" data-open="'+l.id+'">Editar</button>';
  } else if(kind === "resultado"){
    /* Un solo paso: Cerró / No cerró, y si cerró el importe se abre aquí mismo. */
    tone = "late";
    tags = '<span class="chip good">Vino</span>';
    if(l.cierre === true){
      tags += '<span class="chip good">Cerró</span>';
      right = '<span class="amountbox">' +
              '<input type="number" data-amount="'+l.id+'" placeholder="¿Cuánto?" min="0" step="25" ' +
              'inputmode="decimal" class="mono">' +
              '<button class="btn sm primary" data-saveamount="'+l.id+'">Guardar</button>' +
              '<button class="btn sm ghost" data-close="'+l.id+'|x" title="Deshacer">↩</button></span>';
    } else {
      right = '<button class="btn sm good" data-close="'+l.id+'|1">Cerró</button>' +
              '<button class="btn sm" data-close="'+l.id+'|0">No cerró</button>';
    }
  } else if(kind === "cerrar"){
    tone = "late";
    tags = '<span class="chip good">Vino</span>';
    right = '<button class="btn sm good" data-close="'+l.id+'|1">Cerró</button>' +
            '<button class="btn sm" data-close="'+l.id+'|0">No cerró</button>';
  } else if(kind === "importe"){
    tone = "late";
    tags = '<span class="chip good">Cerró</span>';
    right = '<span class="amountbox">' +
            '<input type="number" data-amount="'+l.id+'" placeholder="¿Cuánto?" min="0" step="25" ' +
            'inputmode="decimal" class="mono">' +
            '<button class="btn sm primary" data-saveamount="'+l.id+'">Guardar</button></span>';
  } else if(kind === "proxima"){
    tone = "booked";
    const falta = municionFaltante(l);
    if(falta.length) tags = '<span class="chip crit" title="El closer entra sin esto">falta: '+esc(falta.join(", "))+'</span>';
    right = resultadoBtns(l);
  } else if(kind === "next"){
    tone = "booked";
    const falta2 = municionFaltante(l);
    if(falta2.length) tags = '<span class="chip crit">falta: '+esc(falta2.join(", "))+'</span>';
    right = '<button class="btn sm ghost" data-open="'+l.id+'">Ver</button>';
  } else {
    right = '<button class="btn sm ghost" data-open="'+l.id+'">Editar</button>';
    tags = l.show === false ? '<span class="chip crit">No vino</span>'
      : l.cierre === true ? '<span class="chip good">Cerró · '+money(l.importe)+'</span>'
      : '<span class="chip">No cerró'+(l.objecion?" · "+esc(l.objecion):"")+'</span>';
  }
  if(l.seed) tags += '<span class="chip" title="Entró en la importación inicial.">sin historial</span>';

  return '<div class="row '+tone+'">' +
    '<button class="row-main" data-open="'+l.id+'">' +
      '<span class="row-l1"><span class="h">@'+esc(l.handle)+'</span>'+(l.nombre && norm(l.nombre)!==norm(l.handle)?'<span class="n">'+esc(l.nombre)+'</span>':"")+'</span>' +
      '<span class="row-l2"><span class="mono">'+when+'</span>'+tags+'</span>' +
    '</button><span class="row-acts">'+right+'</span></div>';
}
/* Las dos fechas de agenda las pone el SETTER. El closer solo las ve. */
function sinFechaGroup(list){
  if(!list.length) return "";
  const mine = ROLE === "setter";
  const ro = mine ? "" : " disabled";
  return '<section class="qgroup"><div class="qhead"><h3>Agendaron · falta la fecha</h3>' +
    '<span class="n">'+list.length+'</span><span class="rule"></span></div>' +
    '<p class="helptext" style="margin:-4px 0 9px">' +
      (mine ? 'Los tags de ManyChat dicen que agendó pero no para cuándo. Pon las dos fechas y pasa a la vista de llamadas.'
            : 'El setter todavía no ha puesto la fecha de estas llamadas. Aquí solo las ves.') + '</p>' +
    '<div class="rows">'+list.map(l =>
      '<div class="row late" style="flex-wrap:wrap"><button class="row-main" data-open="'+l.id+'">' +
        '<span class="row-l1"><span class="h">@'+esc(l.handle)+'</span>'+(l.nombre && norm(l.nombre)!==norm(l.handle)?'<span class="n">'+esc(l.nombre)+'</span>':"")+'</span>' +
        '<span class="row-l2"><span class="chip crit">falta la fecha</span>'+(l.seed?'<span class="chip">sin historial</span>':'')+'</span></button>' +
        '<span style="display:flex;gap:8px;flex:none;flex-wrap:wrap">' +
          '<span><label class="f" for="bc_'+l.id+'">Fecha de la llamada</label>' +
            '<input type="date" id="bc_'+l.id+'" data-calldate="'+l.id+'" value="'+(l.agendo||"")+'" style="width:auto"'+ro+'></span>' +
          '<span><label class="f" for="bh_'+l.id+'">Hora</label>' +
            '<input type="time" id="bh_'+l.id+'" data-callhora="'+l.id+'" value="'+(l.agendoHora||"")+'" style="width:auto"'+ro+'></span>' +
        '</span></div>').join("") +
    '</div></section>';
}

function viewLlamadas(){
  const c = callQueue();
  const T = todayStr();
  const money30 = LEADS.filter(l => l.cierre === true && l.cierreAt && l.cierreAt >= addDays(T,-29))
                        .reduce((a,l) => a + (+l.importe||0), 0);
  const head =
    '<div class="stats" style="margin-bottom:18px">' +
      '<div class="stat'+(c.proximas.length?" cool":"")+'"><div class="k">Confirmadas</div><div class="v">'+c.proximas.length+'</div><div class="d">con fecha y hora</div></div>' +
      '<div class="stat'+(c.sinFecha.length+c.sinHora.length?" crit":"")+'"><div class="k">Sin confirmar</div><div class="v">'+(c.sinFecha.length+c.sinHora.length)+'</div><div class="d">falta fecha u hora</div></div>' +
      '<div class="stat'+(c.porRegistrar.length+c.porResultado.length?" warn":"")+'"><div class="k">Pendientes</div><div class="v">'+(c.porRegistrar.length+c.porResultado.length)+'</div><div class="d">resultado o $</div></div>' +
      '<div class="stat good"><div class="k">Cash 30 días</div><div class="v">'+money2(money30)+'</div><div class="d">por fecha de cobro</div></div>' +
    '</div>';

  /* La alerta cubre TODA llamada pendiente, tenga hora o no. */
  const ciegas = LEADS.filter(l => municionFaltante(l).length);
  const alerta = ciegas.length ? '<div class="banner crit"><p><b>' +
      (ciegas.length === 1 ? 'Una llamada agendada va incompleta.' : ciegas.length+' llamadas agendadas van incompletas.') +
      '</b> ' + (ROLE === "setter"
        ? 'El closer necesita meta, dolor y qué ya hace. Ábrelas y escribe lo que te dijeron: '
        : 'Pídeselas al setter antes de la llamada: ') +
      ciegas.map(l => '@'+esc(l.handle)+' <span style="opacity:.75">(falta '+esc(municionFaltante(l).join(", "))+')</span>').join(" · ") +
      '</p></div>' : "";
  const proximas = c.proximas.length ?
    '<section class="qgroup hero">' +
      '<div class="qhead"><h3>Próximas llamadas</h3><span class="n">'+c.proximas.length+'</span><span class="rule"></span></div>' +
      '<p class="helptext" style="margin:-4px 0 9px">Confirmadas: día y hora puestos. Estas son las que van a pasar.</p>' +
      '<div class="rows">'+c.proximas.map(l => callRow(l, "proxima")).join("")+'</div>' +
    '</section>' : "";

  const sinFecha = sinFechaGroup(c.sinFecha);

  const grp = (titulo, list, kind, hint) => list.length ?
    '<section class="qgroup"><div class="qhead"><h3>'+titulo+'</h3><span class="n">'+list.length+'</span><span class="rule"></span></div>' +
    (hint ? '<p class="helptext" style="margin:-4px 0 9px">'+hint+'</p>' : "") +
    '<div class="rows">'+list.map(l => callRow(l, kind)).join("")+'</div></section>' : "";

  if(!c.sinFecha.length && !c.sinHora.length && !c.porRegistrar.length && !c.porResultado.length && !c.proximas.length && !c.cerradas.length && !c.noCerraron.length){
    return modeBanner() + '<div class="section"><div class="h-row"><h2>Llamadas</h2></div>' +
      '<div class="card empty"><h3>No hay llamadas todavía</h3><p>Cuando el setter marque que alguien agendó, la llamada aparece aquí para registrar el resultado.</p></div></div>';
  }

  return modeBanner() + '<div class="section">' +

/* --- Embudo por tags de ManyChat ------------------------------------------
   Este es el embudo que mira el cliente: dónde está parada la gente HOY según
   los tags. No usa fechas ni período — es una foto de toda la base. */
const LADDER = [
  {k:"contesto",   lab:"Interest",  hint:"contestó, hay conversación"},
  {k:"calificado", lab:"Lead",      hint:"califica para la llamada"},
  {k:"propuesta",  lab:"Link",      hint:"le mandaste el link"},
  {k:"agendo",     lab:"Booked",    hint:"agendó la llamada"},
  {k:"cliente",    lab:"Client",    hint:"pagó"}
];
function tagStages(l){ return (l.tags||[]).map(t => guessStage(tagName(t))).filter(Boolean); }
/* La etapa más alta que prueban sus tags. null = no tiene ningún tag de etapa. */
function topTagRank(l){
  const r = tagStages(l).filter(k => k !== "muerto" && k !== "vsl").map(etapaRank);
  return r.length ? Math.max.apply(null, r) : null;
}
function tagFunnel(){
  const conRank = LEADS.map(l => ({ l, r:topTagRank(l), st:tagStages(l) }));
  const pasos = LADDER.map((p, i) => {
    const rk = etapaRank(p.k);
    /* "parados aquí" = llegó a este escalón pero no al siguiente. Así los tags
       que no tienen escalón propio (Interest Buildup) cuentan en el de abajo
       en vez de desaparecer. */
    const sig = LADDER[i+1] ? etapaRank(LADDER[i+1].k) : Infinity;
    return {
      lab:p.lab, hint:p.hint,
      alcanzaron: conRank.filter(x => x.r !== null && x.r >= rk).length,
      aqui:       conRank.filter(x => x.r !== null && x.r >= rk && x.r < sig).length
    };
  });
  return {
    pasos,
    muertos: conRank.filter(x => x.st.indexOf("muerto") >= 0).length,
    vsl:     conRank.filter(x => x.st.indexOf("vsl") >= 0).length,
    /* sin tag de verdad: ni escalón, ni VSL, ni "no interesado" */
    sinTag:  conRank.filter(x => x.r === null && x.st.length === 0).length,
    total:   LEADS.length
  };
}
function funnelTagsHTML(){
  const f = tagFunnel();
  if(!f.pasos[0].alcanzaron)
    return '<p class="helptext">' + (f.total
      ? 'Tus '+f.total+' contactos no traen tags de etapa de ManyChat. En cuanto la sincronización los traiga con tags, el embudo se llena solo.'
      : 'Todavía no hay contactos.') + '</p>';
  const max = Math.max(1, f.pasos[0].alcanzaron);
  let out = '<div class="funnel">';
  f.pasos.forEach((p, i) => {
    if(i > 0){
      const prev = f.pasos[i-1].alcanzaron;
      out += '<div class="fdrop"><span>↓</span><span class="pct">'+pctStr(pct(p.alcanzaron, prev))+'</span></div>';
    }
    /* tope 80% para que "N parados aquí" siempre quepa al lado */
    const w = Math.max(12, p.alcanzaron / max * 80);
    out += '<div class="fstep"><div class="fbar" style="width:'+w+'%">' +
      '<span class="fn">'+p.alcanzaron+'</span><span class="fl">'+esc(p.lab)+'</span></div>' +
      '<span class="fhere">'+(p.aqui ? p.aqui+' parados aquí' : '—')+'</span></div>';
  });
  out += '</div>';
  const chip = (n, lab, cls) => n ? '<span class="chip '+cls+'">'+n+' · '+lab+'</span>' : "";
  const fuera = chip(f.vsl, "VSL", "b2") + chip(f.muertos, "No interesado", "crit") + chip(f.sinTag, "sin tag", "");
  if(fuera) out += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:14px">'+fuera+'</div>';
  return out;
}

const FIELDS = [
  {k:"handle", lab:"@Handle", req:true},
  {k:"fuente", lab:"Fuente"},
