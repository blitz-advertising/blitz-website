/* Tabla compartida por Leads, Interesados y Archivo. La columna "Calor" es la
   que ordena: 🔥 el que esta a un paso, 🧊 el mas frio de todos. */
/* El emoji NO sustituye al tag: lo acompaña. El tag dice que es; el emoji dice
   como de caliente, para poder escanear la columna sin leer palabra por palabra.
   La escala va de fuego a hielo y es siempre la misma en todas las pestañas. */
function calorChip(l){
  const t = tagDominante(l);
  const chip = (emoji, texto, cls) =>
    '<span class="heat '+(cls||"")+'"><i class="em">'+emoji+'</i>'+esc(texto)+'</span>';

  /* Archivo primero: "Not Closed" arrastra blockFloor 04 Pre-call y sin esta
     salida saldria como 🔥 — cuando ya tuvo su llamada y no compro. */
  /* Sin historial primero: da igual que arrastre Client o Booked de antes. */
  if(l.seed) return chip("🗄️","Archivado","dead");
  /* Cliente despues: pago, y eso manda sobre cualquier otro tag que arrastre. */
  if(l.cierre === true || tieneTag(l,"Tag Client")) return chip("💪🏼","Client","client");
  if(esNoCerro(l))      return chip("👎🏼","No cerró","dead");
  if(esNoInteresado(l)) return chip("🚫","No interesado","dead");

  /* Un Lead ya pregunto por precio o por el programa: entra caliente de una.
     Por eso el fuego empieza ahi y no mas arriba. */
  if(tieneTag(l,"Tag Booked"))                    return chip("✅","Booked","hot");
  if(tieneTag(l,"Tag Link") || blockIdx(l) >= 4)  return chip("🔥🔥", t ? tagName(t) : "Pre-call", "hot");
  if(tieneTag(l,"Tag Lead"))                      return chip("🔥","Lead","hot");
  if(tieneTag(l,"Tag Warming Lead"))              return chip("🧨","Warming Lead","warm");
  if(tieneTag(l,"Tag Interest"))                  return chip("🧊","Interest","cool");
  if(tieneTag(l,"Tag Interest Buildup") ||
     tieneTag(l,"Ta Interest Buildup"))           return chip("🧊🧊","Interest Buildup","ice");
  /* Sin tag de ManyChat: se situa por lo avanzado que va el guion. */
  const b = blockIdx(l);
  return chip(b >= 3 ? "🔥" : b >= 1 ? "🧊" : "⚪", BLOQUES[b].slice(3), b >= 3 ? "hot" : b >= 1 ? "cool" : "");
}
/* En Archivo las dos primeras columnas cambian de significado: la primera dice
   POR QUE esta archivado, y donde iba el bloque del guion va el CALOR que tenia
   al archivarse. El bloque no aporta nada aqui — nadie va a seguir el guion con
   alguien que ya dijo que no. Lo util para rescatarlo es lo caliente que estaba. */
function tablaSegmento(list, archivo){
  const rows = list.map(l => {
    const notas = [l.meta && "meta", l.dolor && "dolor", l.yaHace && "ya hace"].filter(Boolean);
    const d = diasSinTocar(l);
    const frio = estaFrio(l);
    return '<tr><td>'+(archivo
        ? '<span class="heat dead"><i class="em">🗄️</i>Archivado</span>'
        : calorChip(l))+'</td>' +
      '<td><button class="linkish" data-open="'+l.id+'">@'+esc(l.handle)+'</button></td>' +
      '<td>'+esc(l.nombre||"—")+'</td>' +
      '<td>'+(archivo ? motivoChip(l) : blockChip(l))+'</td>' +
      '<td class="mono'+(frio?' crit':'')+'" title="Días desde el último toque">'+(d>=999?"nunca":d===0?"hoy":d+"d")+'</td>' +
      '<td>'+(notas.length?esc(notas.join(" · ")):'<span style="color:var(--warn)">sin notas</span>')+'</td>' +
      '<td class="mono" title="'+esc(entryTitle(l.entry, l.subscribedAt))+'">'+fmtShort(l.entry)+'</td></tr>';
  }).join("");
  return '<div class="tablewrap"><table><thead><tr>' +
    '<th>'+(archivo ? "Estado" : "Calor")+'</th><th>Handle</th><th>Nombre</th>' +
    '<th>'+(archivo ? "Motivo" : "Bloque")+'</th>' +
    '<th>Sin tocar</th><th>Notas</th><th>Entró</th></tr></thead><tbody>' +
    rows + '</tbody></table></div>';
}

/* Cuantos toques lleva el dia. El closer no necesita saber A QUIEN se tocó
   —eso es trabajo del setter—, pero si cuanto se esta alimentando el pipeline:
   de ahi salen sus llamadas de la semana que viene. */
function barraToquesHTML(){
  const t = toquesHoy(), meta = CFG.metaToques || DEFAULT_CFG.metaToques;
  const pct = Math.min(100, meta ? (t / meta) * 100 : 0);
  return '<div class="barratoques'+(t >= meta ? " done" : "")+'">' +
    '<div class="bt-top">' +
      '<span class="lab">Toques del día</span>' +
      '<span class="val num">'+t+'<small>/'+meta+'</small></span>' +
    '</div>' +
    '<div class="track"><i class="'+(t >= meta ? "done" : "")+'" style="width:'+pct+'%"></i></div>' +
  '</div>';
}

/* Por que esta archivado. En Archivo todos son archivados —eso lo dice la
   primera columna—, asi que lo que aporta aqui es el motivo. */
function motivoChip(l){
  const chip = (em, txt, cls) => '<span class="heat '+(cls||"")+'"><i class="em">'+em+'</i>'+esc(txt)+'</span>';
  if(esNoCerro(l))      return chip("👎🏼","No cerró","dead");
  if(esNoInteresado(l)) return chip("🚫","No interesado","dead");
  if(l.cierre === true || tieneTag(l,"Tag Client")) return chip("💪🏼","Cliente","client");
  return chip("🗄️","A mano","dead");   /* lo archivaste tu, sin tag que lo explique */
}

/* ===================== render: ARCHIVO =====================
   No interesados y no cerraron. No se borran: en unos meses el momento
   puede ser otro, y aqui es donde se busca a quien volver a escribir. */
function viewArchivo(){
  const f = FILTERS;
  let list = enSegmento("archivo");
  if(f.q){
    const s = f.q.toLowerCase();
    list = list.filter(l => (l.handle+" "+l.nombre+" "+l.meta+" "+l.dolor).toLowerCase().includes(s));
  }
  /* Una sola lista, sin subgrupos: el motivo ya lo dice el emoji de cada fila,
     asi que partirlo en "No cerraron" y "No interesados" era decir lo mismo dos
     veces. Ordenados por lo mas reciente primero. */
  list.sort((a,b) => {
    const fa = a.cierreAt || a.entry || "", fb = b.cierreAt || b.entry || "";
    return fb < fa ? -1 : 1;
  });
  const total = enSegmento("archivo").length;
  const filtro = '<div class="filters"><input type="text" id="fq" placeholder="Buscar handle o nombre…" value="'+esc(f.q)+'"></div>';
  if(!list.length){
    return modeBanner() + '<div class="section"><div class="h-row"><h2>Archivo</h2></div>' + filtro +
      '<div class="card empty"><h3>Archivo vacío</h3><p>Aquí caen los que dijeron que no, los que no cerraron y los que archivaste a mano.</p></div></div>';
  }
  return modeBanner() + '<div class="section archivo">' +
    '<div class="h-row"><h2>Archivo</h2><span class="sub">'+list.length+' de '+total+'</span></div>' +
    '<p class="helptext" style="margin:-4px 0 12px">No se borran. Dentro de unos meses el momento puede ser otro — de aquí sale el follow-up frío. La columna de calor dice por qué está archivado cada uno.</p>' +
    filtro + tablaSegmento(list, true) +
    '</div>';
}

/* ===================== render: LLAMADAS ===================== */
/* El closer decide en un solo paso, y los botones están siempre a la vista:
   verde cierra, rojo no cierra, Ver abre la ficha (ahí adentro está "no vino",
   que es un caso raro y no merece un botón en la tarjeta). */
function resultadoBtns(l){
  return '<button class="btn sm good" data-close="'+l.id+'|1">Cerró</button>' +
         '<button class="btn sm crit" data-close="'+l.id+'|0">No cerró</button>' +
         '<button class="btn sm ghost" data-open="'+l.id+'">Ver</button>';
}
function callRow(l, kind){
  const when = l.agendo ? fmtCita(l) : (l.callDate ? fmtLongDate(l.callDate) : "sin fecha");
  let right = "", tone = "done", tags = "";

  if(kind === "reg"){
    tone = "late";
    right = resultadoBtns(l);
  } else if(kind === "cerrada"){
    tone = "done";
    tags = '<span class="chip good">Cerró</span>';
    right = (+l.importe > 0)
      ? '<span class="chip good">'+money2(l.importe)+'</span>' +
        '<button class="btn sm ghost" data-open="'+l.id+'">Editar</button>'
      : '<span class="amountbox">' +
        '<input type="number" data-amount="'+l.id+'" placeholder="¿Cuánto?" min="0" step="25" inputmode="decimal" class="mono">' +
        '<button class="btn sm primary" data-saveamount="'+l.id+'">Guardar</button>' +
        '<button class="btn sm ghost" data-close="'+l.id+'|x" title="Deshacer">↩</button></span>';
  } else if(kind === "nocerro"){
    tone = "done";
    tags = l.show === false
      ? '<span class="chip crit">No vino</span>'
      : '<span class="chip">No cerró'+(l.objecion?" · "+esc(l.objecion):" · falta la objeción")+'</span>';
    right = '<button class="btn sm ghost" data-open="'+l.id+'">Editar</button>';
  } else if(kind === "resultado"){
    /* Un solo paso: Cerró / No cerró, y si cerró el importe se abre aquí mismo. */
    tone = "late";
    tags = '<span class="chip good">Vino</span>';
    if(l.cierre === true){
      tags += '<span class="chip good">Cerró</span>';
      right = '<span class="amountbox">' +
              '<input type="number" data-amount="'+l.id+'" placeholder="¿Cuánto?" min="0" step="25" ' +
              'inputmode="decimal" class="mono">' +
              '<button class="btn sm primary" data-saveamount="'+l.id+'">Guardar</button>' +
              '<button class="btn sm ghost" data-close="'+l.id+'|x" title="Deshacer">↩</button></span>';
    } else {
      right = '<button class="btn sm good" data-close="'+l.id+'|1">Cerró</button>' +
              '<button class="btn sm" data-close="'+l.id+'|0">No cerró</button>';
    }
  } else if(kind === "cerrar"){
    tone = "late";
    tags = '<span class="chip good">Vino</span>';
    right = '<button class="btn sm good" data-close="'+l.id+'|1">Cerró</button>' +
            '<button class="btn sm" data-close="'+l.id+'|0">No cerró</button>';
  } else if(kind === "importe"){
    tone = "late";
    tags = '<span class="chip good">Cerró</span>';
    right = '<span class="amountbox">' +
            '<input type="number" data-amount="'+l.id+'" placeholder="¿Cuánto?" min="0" step="25" ' +
            'inputmode="decimal" class="mono">' +
            '<button class="btn sm primary" data-saveamount="'+l.id+'">Guardar</button></span>';
  } else if(kind === "proxima"){
    tone = "booked";
    const falta = municionFaltante(l);
    if(falta.length) tags = '<span class="chip crit" title="El closer entra sin esto">falta: '+esc(falta.join(", "))+'</span>';
    right = resultadoBtns(l);
  } else if(kind === "next"){
    tone = "booked";
    const falta2 = municionFaltante(l);
    if(falta2.length) tags = '<span class="chip crit">falta: '+esc(falta2.join(", "))+'</span>';
    right = '<button class="btn sm ghost" data-open="'+l.id+'">Ver</button>';
  } else {
    right = '<button class="btn sm ghost" data-open="'+l.id+'">Editar</button>';
    tags = l.show === false ? '<span class="chip crit">No vino</span>'
      : l.cierre === true ? '<span class="chip good">Cerró · '+money(l.importe)+'</span>'
      : '<span class="chip">No cerró'+(l.objecion?" · "+esc(l.objecion):"")+'</span>';
  }
  if(l.seed) tags += '<span class="chip" title="Archivado: fuera de las métricas.">archivado</span>';

  return '<div class="row '+tone+'">' +
    '<button class="row-main" data-open="'+l.id+'">' +
      '<span class="row-l1"><span class="h">@'+esc(l.handle)+'</span>'+(l.nombre && norm(l.nombre)!==norm(l.handle)?'<span class="n">'+esc(l.nombre)+'</span>':"")+'</span>' +
      '<span class="row-l2"><span class="mono">'+when+'</span>'+tags+'</span>' +
    '</button><span class="row-acts">'+right+'</span></div>';
}
/* Las dos fechas de agenda las pone el SETTER. El closer solo las ve. */
function sinFechaGroup(list){
  if(!list.length) return "";
  const mine = ROLE === "setter";
  const ro = mine ? "" : " disabled";
  return '<section class="qgroup"><div class="qhead"><h3>Agendaron · falta confirmarlas</h3>' +
    '<span class="n">'+list.length+'</span><span class="rule"></span></div>' +
    '<p class="helptext" style="margin:-4px 0 9px">' +
      (mine ? 'Los tags de ManyChat dicen que agendó pero no para cuándo. Se quedan aquí hasta que tengan <b>día y hora</b>; con las dos puestas pasan a Llamadas.'
            : 'El setter todavía no ha confirmado día y hora. Aquí solo las ves.') + '</p>' +
    '<div class="rows">'+list.map(l =>
      '<div class="row late" style="flex-wrap:wrap"><button class="row-main" data-open="'+l.id+'">' +
        '<span class="row-l1"><span class="h">@'+esc(l.handle)+'</span>'+(l.nombre && norm(l.nombre)!==norm(l.handle)?'<span class="n">'+esc(l.nombre)+'</span>':"")+'</span>' +
        '<span class="row-l2"><span class="chip crit">falta la fecha</span>'+(l.seed?'<span class="chip">archivado</span>':'')+'</span></button>' +
        '<span style="display:flex;gap:8px;flex:none;flex-wrap:wrap">' +
          '<span><label class="f" for="bc_'+l.id+'">Fecha de la llamada</label>' +
            '<input type="date" id="bc_'+l.id+'" data-calldate="'+l.id+'" value="'+(l.agendo||"")+'" style="width:auto"'+ro+'></span>' +
          '<span><label class="f" for="bh_'+l.id+'">Hora</label>' +
            '<input type="time" id="bh_'+l.id+'" data-callhora="'+l.id+'" value="'+(l.agendoHora||"")+'" style="width:auto"'+ro+'></span>' +
        '</span></div>').join("") +
    '</div></section>';

function viewLlamadas(){
  const c = callQueue();
  const T = todayStr();
  /* Sin los "sin historial": ni su cash viejo cuenta ni sus llamadas de antes
     del CRM salen en la alerta de munición. Están solo en Archivo. */
  const LEADS = REAL();
  const money30 = LEADS.filter(l => l.cierre === true && l.cierreAt && l.cierreAt >= addDays(T,-29))
                        .reduce((a,l) => a + (+l.importe||0), 0);
  const head =
    '<div class="stats stats--3" style="margin-bottom:18px">' +
      '<div class="stat'+(c.proximas.length?" cool":"")+'"><div class="k">Confirmadas</div><div class="v">'+c.proximas.length+'</div><div class="d">con fecha y hora</div></div>' +
      /* Prospectos, no "sin confirmar": completar fechas es trabajo del setter y
         al closer no le dice nada. Lo que si le importa es cuanta gente viene
         detras — de ahi salen sus proximas llamadas. */
      '<div class="stat"><div class="k">Prospectos</div><div class="v">'+enSegmento("leads").length+'</div><div class="d">leads en el pipeline</div></div>' +
      /* "Pendientes" fuera: lo que falta por registrar ya se ve abajo, en sus
         propios grupos y con los botones para resolverlo ahí mismo. Como
         numero suelto solo repetia lo que ya estaba a la vista. */
      '<div class="stat good"><div class="k">Cash 30 días</div><div class="v">'+money2(money30)+'</div><div class="d">por fecha de cobro</div></div>' +
    '</div>' +
    /* La barra va aparte, a lo ancho, no como cuarta tarjeta: meterla en la fila
       estrecharia la del cash, que es la que el closer mira primero. */
    barraToquesHTML();

  /* La alerta cubre TODA llamada pendiente, tenga hora o no. */
  const ciegas = LEADS.filter(l => municionFaltante(l).length);
  const alerta = ciegas.length ? '<div class="banner crit"><p><b>' +
      (ciegas.length === 1 ? 'Una llamada agendada va incompleta.' : ciegas.length+' llamadas agendadas van incompletas.') +
      '</b> ' + (ROLE === "setter"
        ? 'El closer necesita meta, dolor y qué ya hace. Ábrelas y escribe lo que te dijeron: '
        : 'Pídeselas al setter antes de la llamada: ') +
      ciegas.map(l => '@'+esc(l.handle)+' <span style="opacity:.75">(falta '+esc(municionFaltante(l).join(", "))+')</span>').join(" · ") +
      '</p></div>' : "";
  /* Cerradas sin importe. Cada una es dinero que entro y no esta contado: sin
     el numero, el cash y el ticket medio salen por debajo de lo real. */
  const debenImporte = c.sinImporte;
  const avisoImporte = debenImporte.length ? '<div class="banner"><p><b>' +
      (debenImporte.length === 1
        ? 'Falta el importe de una venta cerrada.'
        : 'Faltan los importes de '+debenImporte.length+' ventas cerradas.') +
      '</b> Sin el número, tu cash y tu ticket medio salen por debajo de lo real. ' +
      debenImporte.map(l => '<button class="linkish" data-askamount="'+l.id+'">@'+esc(l.handle)+'</button>').join(" · ") +
      '</p></div>' : "";
  /* Este bloque no desaparece nunca. Es lo primero que mira el closer al entrar,
     y si un dia no hay nada debe decirlo — no dejar un hueco que parezca un
     fallo de carga o que obligue a buscar la agenda en otro sitio. */
  const proximas =
    '<section class="qgroup hero">' +
      '<div class="qhead"><h3>Próximas llamadas</h3>' +
        (c.proximas.length ? '<span class="n">'+c.proximas.length+'</span>' : "") +
        '<span class="rule"></span></div>' +
      (c.proximas.length
        ? '<p class="helptext" style="margin:-4px 0 9px">Confirmadas: día y hora puestos. Estas son las que van a pasar.</p>' +
          '<div class="rows">'+c.proximas.map(l => callRow(l, "proxima")).join("")+'</div>'
        : '<p class="nada">Por el momento no hay llamadas confirmadas.' +
          (c.sinFecha.length || c.sinHora.length
            ? ' Hay '+(c.sinFecha.length + c.sinHora.length)+' sin confirmar más abajo.'
            : ' Cuando el setter agende una con día y hora, aparecerá aquí.') +
          '</p>') +
    '</section>';

  const sinFecha = sinFechaGroup(c.sinFecha);

  const grp = (titulo, list, kind, hint) => list.length ?

/* --- Embudo por tags de ManyChat ------------------------------------------
   Este es el embudo que mira el cliente: dónde está parada la gente HOY según
   los tags. No usa fechas ni período — es una foto de toda la base. */
const LADDER = [
  {k:"contesto",   lab:"Interest",  hint:"contestó, hay conversación"},
  {k:"calificado", lab:"Lead",      hint:"califica para la llamada"},
  {k:"propuesta",  lab:"Link",      hint:"le mandaste el link"},
  {k:"agendo",     lab:"Booked",    hint:"agendó la llamada"},
  {k:"cliente",    lab:"Client",    hint:"pagó"}
];
function tagStages(l){ return (l.tags||[]).map(t => guessStage(tagName(t))).filter(Boolean); }
/* La etapa más alta que prueban sus tags. null = no tiene ningún tag de etapa. */
function topTagRank(l){
  const r = tagStages(l).filter(k => k !== "muerto" && k !== "vsl").map(etapaRank);
  return r.length ? Math.max.apply(null, r) : null;
}
function tagFunnel(){
  /* El embudo por tags mide tu trabajo: fuera los de antes del CRM. */
  const conRank = REAL().map(l => ({ l, r:topTagRank(l), st:tagStages(l) }));
  const pasos = LADDER.map((p, i) => {
    const rk = etapaRank(p.k);
    /* "parados aquí" = llegó a este escalón pero no al siguiente. Así los tags
       que no tienen escalón propio (Interest Buildup) cuentan en el de abajo
       en vez de desaparecer. */
    const sig = LADDER[i+1] ? etapaRank(LADDER[i+1].k) : Infinity;
    return {
      lab:p.lab, hint:p.hint,
      alcanzaron: conRank.filter(x => x.r !== null && x.r >= rk).length,
      aqui:       conRank.filter(x => x.r !== null && x.r >= rk && x.r < sig).length
    };
  });
  return {
    pasos,
    muertos: conRank.filter(x => x.st.indexOf("muerto") >= 0).length,
    vsl:     conRank.filter(x => x.st.indexOf("vsl") >= 0).length,
    /* sin tag de verdad: ni escalón, ni VSL, ni "no interesado" */
    sinTag:  conRank.filter(x => x.r === null && x.st.length === 0).length,
    total:   LEADS.length
  };
}
function funnelTagsHTML(){
  const f = tagFunnel();
  if(!f.pasos[0].alcanzaron)
    return '<p class="helptext">' + (f.total
      ? 'Tus '+f.total+' contactos no traen tags de etapa de ManyChat. En cuanto la sincronización los traiga con tags, el embudo se llena solo.'
      : 'Todavía no hay contactos.') + '</p>';
  const max = Math.max(1, f.pasos[0].alcanzaron);
  let out = '<div class="funnel">';
  f.pasos.forEach((p, i) => {
    if(i > 0){
      const prev = f.pasos[i-1].alcanzaron;
      out += '<div class="fdrop"><span>↓</span><span class="pct">'+pctStr(pct(p.alcanzaron, prev))+'</span></div>';
    }
    /* tope 80% para que "N parados aquí" siempre quepa al lado */
    const w = Math.max(12, p.alcanzaron / max * 80);
    out += '<div class="fstep"><div class="fbar" style="width:'+w+'%">' +
      '<span class="fn">'+p.alcanzaron+'</span><span class="fl">'+esc(p.lab)+'</span></div>' +
      '<span class="fhere">'+(p.aqui ? p.aqui+' parados aquí' : '—')+'</span></div>';
  });
  out += '</div>';
  const chip = (n, lab, cls) => n ? '<span class="chip '+cls+'">'+n+' · '+lab+'</span>' : "";
  const fuera = chip(f.vsl, "VSL", "b2") + chip(f.muertos, "No interesado", "crit") + chip(f.sinTag, "sin tag", "");
  if(fuera) out += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:14px">'+fuera+'</div>';
  return out;
}

];

/* --- etapas del embudo a las que se puede mapear un tag --- */
const ETAPAS = [
  {k:"",           lab:"— no usar —",              rank:-1},
  {k:"muerto",     lab:"No interesado",            rank:0.5},
  {k:"contesto",   lab:"Contestó · hay conversación", rank:1},
  {k:"dolor",      lab:"Ya soltó el dolor",        rank:2},
  {k:"calificado", lab:"Calificado",               rank:3},
  {k:"vsl",        lab:"VSL · vía alterna",        rank:3.5},
  {k:"propuesta",  lab:"Le mandé el link",         rank:4},
  {k:"agendo",     lab:"Agendó",                   rank:5},
  {k:"cliente",    lab:"Cliente · pagó",           rank:6}
];
const etapaRank = k => (ETAPAS.find(e => e.k === k) || {rank:-1}).rank;

function guessStage(h){
  const s = String(h||"").toLowerCase();
  if(/no\s*inter|not\s*inter/.test(s)) return "muerto";
  /* "Not Closed" = estuvo en la llamada y no cerró. Llegó hasta agendó, no es un muerto. */
  if(/not\s*clos|no\s*cerr/.test(s))     return "agendo";
  if(/build\s*up|buildup/.test(s))     return "dolor";
  if(/vsl/.test(s))                    return "vsl";
  if(/link/.test(s))                   return "propuesta";
  if(/book/.test(s))                   return "agendo";
  if(/client|cliente/.test(s))         return "cliente";
  if(/warm/.test(s))                   return "calificado";
  if(/lead/.test(s))                   return "calificado";
  if(/interes|interest/.test(s))       return "contesto";
  return "";
}

const TRUEW = ["true","verdadero","1","sí","si","yes","x","v"];
const BOOLW = TRUEW.concat(["false","falso","0","no","n","-"]);
function isTrue(v){ return TRUEW.indexOf(String(v==null?"":v).trim().toLowerCase()) >= 0; }
function isTagCol(rows, i){
  let seen = 0;
  for(const r of rows){
    const v = String(r[i]==null?"":r[i]).trim().toLowerCase();
    if(v === "") continue;
    if(BOOLW.indexOf(v) < 0) return false;
    seen++;
  }
  return seen > 0;
}

/* Un contacto puede traer VARIOS tags de ManyChat — se aplican todos, no gana uno solo.
   Lo que sí manda el más avanzado es el bloque alcanzado.
   No se ponen fechas: lo que pasó antes de importar no tiene fecha real, así que
   estos leads quedan marcados como arrastre y fuera de las tasas. */
/* Un tag "Src ..." / "Fuente ..." no es una etapa: dice por dónde entró la persona.
   ManyChat no guarda el punto de entrada por su cuenta, así que esto solo funciona
   si el flow de cada trigger le pone su tag al contacto. */
const SRC_RE = /^(src|source|fuente|entrada|origen)\b[\s:_-]*/i;
const SRC_MAP = [
  [/coment|comment|keyword|palabra/i, "Comentario/Keyword"],
  [/story|historia|stories/i,         "Story reply"],
  [/refer|referral|referido/i,        "Referido"],
  [/outbound|out\b|frio|cold/i,       "Outbound DM"],
  [/inbound|dm|mensaje|in\b/i,        "Inbound DM"],
  [/bienven|welcome|ad\b|anuncio/i,   "Bienvenida"]
];
function srcFromTag(t){
  const limpio = tagName(t);          /* "Tag Src Story" -> "Src Story" */
  if(!SRC_RE.test(limpio)) return "";
  const resto = limpio.replace(SRC_RE,"").trim();
  if(!resto) return "";
  for(const [re, val] of SRC_MAP) if(re.test(resto)) return val;
  return resto;   /* no lo reconozco: lo guardo tal cual en vez de inventar */
}
function applyTags(l, stages, tagNames){
  if(!stages.length && !(tagNames||[]).some(srcFromTag)) return;
  l.seed = true;
  l.tags = tagNames || [];
  l.respondio = true;
  (tagNames || []).forEach(t => { const f = srcFromTag(t); if(f) l.fuente = f; });
  if(!stages.length) return;

  let top = 1;
  /* de menor a mayor: si alguien viene con "No interesado" Y "Cliente", gana Cliente */
  stages.slice().sort((a,b) => etapaRank(a) - etapaRank(b)).forEach(st => {
    const rk = etapaRank(st);
    if(rk > top && st !== "vsl" && st !== "muerto") top = rk;
    if(st === "vsl"){ l.via = "VSL"; if(top < 3) top = 3; }  /* el VSL ya es filtro, pero nunca sube más */
    else if(st === "muerto"){ l.estado = "muerto"; }
    else if(st === "propuesta"){ l.propuesta = true; }
    else if(st === "agendo"){ l.propuesta = true; l.pendingBook = true; l.estado = "activo"; }
    else if(st === "cliente"){
      l.propuesta = true; l.show = true; l.cierre = true;
      l.estado = "cliente"; l.pendingBook = false;
    }
  });
  /* Un tag NO prueba que corriste un bloque del guion. "Interest" o "Lead" dicen
     qué tan caliente está la persona, no que le sacaste la meta o el dolor —
     eso solo lo prueban tus notas. Lo único que un tag sí prueba es que el link
     salió (Link, Booked, Not Closed, Client), y eso es Pre-call de verdad. */
  l.blockFloor = top >= 4 ? BLOQUES[4] : "";
}

function parseCSV(text){
  const rows = []; let row = [], cur = "", q = false;
  text = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  /* Copiar y pegar desde Google Sheets da tabuladores, no comas. */
  const head = text.split("\n")[0] || "";
  const SEP = (head.split("\t").length > head.split(",").length) ? "\t" : ",";
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else {
      if(c === '"') q = true;
      else if(c === SEP){ row.push(cur); cur = ""; }
      else if(c === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; }
      else cur += c;
    }
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ""));
}
function guessMap(headers){
  const map = {}; FIELDS.forEach(f => map[f.k] = "");
  const find = (...pats) => {
    for(let i=0;i<headers.length;i++){
      const h = headers[i].toLowerCase().trim();
      if(pats.some(p => h.includes(p))) return String(i);
    }
    return "";
  };
  map.handle = find("handle","username","user name","instagram","usuario","ig ","@");
  map.fuente = find("fuente","source","origen","canal","flow");
  map.nombre = find("nombre","name","first");
  map.meta   = find("meta","goal","objetivo");
  map.dolor  = find("dolor","pain","problema");
  return map;
}
function normDate(s){
  if(!s) return null;
  s = String(s).trim();
  let mm = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(mm) return mm[1]+"-"+mm[2]+"-"+mm[3];
  mm = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(mm) return mm[3]+"-"+pad(mm[2])+"-"+pad(mm[1]);
  const d = new Date(s);
  if(!isNaN(d.getTime())) return iso(d);
  return null;
}
function leadsToCSV(){
  const cols = ["handle","nombre","fuente","entry","block","respondio","respondioAt","propuesta","propuestaAt",
    "agendo","agendoAt","callDate","show","cierre","cierreAt","oferta","importe","objecion","estado","meta","dolor","comentarios"];
  const head = ["Handle","Nombre","Fuente","Fecha entrada","Bloque","Respondió","Fecha respondió","Propuesta","Fecha propuesta",
    "Fecha agendada","Fecha agendó","Fecha llamada","Show","Cierre","Fecha cierre","Oferta","Importe","Objeción","Estado","Meta","Dolor","Comentarios"];
  const q = v => { const s = v===null||v===undefined?"":String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [head.join(",")];
  LEADS.forEach(l => lines.push(cols.map(c => {
    let v = l[c];
    if(c === "handle") v = "@"+l.handle;
    if(v === true) v = "Sí"; if(v === false) v = "No";
    return q(v);
  }).join(",")));
  return lines.join("\n");
}
async function doExport(){

    toast("CSV guardado.");
  }catch(e){
    if(e && e.code === "declined") return;
    toast("No se pudo descargar el CSV.");
  }
}

/* --- Escritor de .xlsx propio ---------------------------------------------
   Un .xlsx es un ZIP con XML adentro. Lo armamos a mano (unas 90 líneas) en vez
   de cargar una librería de 900 KB desde un CDN: así el artifact es autónomo y
   la exportación funciona aunque el CDN esté caído o bloqueado. */
const XML_ESC = t => String(t).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"})[c]);
function colName(i){ let s=""; i++; while(i>0){ const r=(i-1)%26; s=String.fromCharCode(65+r)+s; i=(i-r-1)/26; } return s; }
const CRCT = (() => { const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRCT[(c ^ u8[i]) & 0xFF] ^ (c>>>8); return (c ^ 0xFFFFFFFF)>>>0; }
function zip(files){
  const enc = new TextEncoder();
  const parts = [], dir = []; let off = 0;
  const u16 = n => [n & 255, (n>>>8) & 255];
  const u32 = n => [n & 255, (n>>>8) & 255, (n>>>16) & 255, (n>>>24) & 255];
  files.forEach(f => {
    const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    const head = [].concat([0x50,0x4B,3,4], u16(20), u16(0x800), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
    parts.push(new Uint8Array(head), name, data);
    dir.push({ name, crc, len:data.length, off });
    off += head.length + name.length + data.length;
  });
  const cd = [];
  dir.forEach(d => {
    const head = [].concat([0x50,0x4B,1,2], u16(20), u16(20), u16(0x800), u16(0), u16(0), u16(0),
      u32(d.crc), u32(d.len), u32(d.len), u16(d.name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(d.off));
    cd.push(new Uint8Array(head), d.name);
  });
  const cdLen = cd.reduce((a,x) => a + x.length, 0);
  const eocd = new Uint8Array([].concat([0x50,0x4B,5,6], u16(0), u16(0),
    u16(dir.length), u16(dir.length), u32(cdLen), u32(off), u16(0)));
  const all = parts.concat(cd, [eocd]);
  const total = all.reduce((a,x) => a + x.length, 0);
  const out = new Uint8Array(total); let q = 0;
  all.forEach(x => { out.set(x, q); q += x.length; });
  return out;
}
/* s=1 título, s=2 cabecera de grupo, s=3 cabecera de columna */
function sheetXML(aoa, anchos){
  const cols = anchos ? '<cols>' + anchos.map((w,i) =>
    '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join("") + '</cols>' : "";
  const rows = aoa.map((row, r) => {
    const st = r === 0 ? 1 : (r === 2 || r === 3 || r === 4) ? 3 : 0;
    const cells = (row||[]).map((v, c) => {
      if(v === null || v === undefined || v === "") return "";
      const ref = colName(c) + (r+1);
      const sa = st ? ' s="'+st+'"' : "";
      return (typeof v === "number" && isFinite(v))
        ? '<c r="'+ref+'"'+sa+'><v>'+v+'</v></c>'
        : '<c r="'+ref+'"'+sa+' t="inlineStr"><is><t xml:space="preserve">'+XML_ESC(v)+'</t></is></c>';
    }).join("");
    return cells ? '<row r="'+(r+1)+'">'+cells+'</row>' : "";
  }).join("");
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    cols + '<sheetData>' + rows + '</sheetData></worksheet>';
}

    { name:"xl/styles.xml", data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +

/* ===================== render ===================== */
/* Al guardar un campo se vuelve a pintar todo. Sin esto el navegador pierde el
   scroll y "la carta se sube" justo cuando terminas de escribir. */
let SKIP_DRAWER = false;
/* La sincronización escribe cada pocas horas y dispara un re-render. Si en ese
   momento el closer está escribiendo un importe, reconstruir el panel le borra
   lo que lleva tecleado — el valor no se guarda hasta que suelta el campo.
   Mientras tenga el foco adentro, el panel no se toca. */
function focoEnDrawer(){
  try{
    const a = document.activeElement;
    return !!(a && a.closest && a.closest(".drawer"));
  }catch(_){ return false; }
}
function render(){
  if(!viewOk(VIEW)) VIEW = navs()[0].k;   // el closer no entra a las vistas del setter
  const y = (typeof window !== "undefined" && window.scrollY) || 0;
  renderNav();
  const v = document.getElementById("view");
  v.innerHTML = VIEW === "hoy" ? viewHoy()
    : VIEW === "leads" ? viewLeads()
    : VIEW === "interesados" ? viewInteresados()
    : VIEW === "archivo" ? viewArchivo()
    : VIEW === "llamadas" ? viewLlamadas()
    : VIEW === "numeros" ? viewNumeros()
    : VIEW === "exportar" ? viewExportar()
    : viewImportar();
  if(!SKIP_DRAWER && !focoEnDrawer()) drawer();
  if(y && typeof window !== "undefined" && window.scrollTo) window.scrollTo(0, y);
}
let TOAST_T = null;
function toast(msg){
  const h = document.getElementById("toastHost");
  h.innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(TOAST_T);
  TOAST_T = setTimeout(() => { h.innerHTML = ""; }, 3200);
}

/* ===================== eventos ===================== */
function getLead(id){ return LEADS.find(l => l.id === id); }

document.addEventListener("click", async (e) => {
  const t = e.target.closest("button");
  if(!t) return;

  if(t.dataset.nav){ if(viewOk(t.dataset.nav)) VIEW = t.dataset.nav; OPEN = null; render(); window.scrollTo(0,0); return; }
  if(t.dataset.role){
    if(ROL_REAL !== "setter") return;     /* el rol lo manda la base */
    ROLE = t.dataset.role; try{ localStorage.setItem(LS_ROLE, ROLE); }catch(_){}
    VIEW = ROLE === "closer" ? "llamadas" : "hoy"; render(); return; }
  if(t.dataset.period !== undefined && t.dataset.period !== ""){ PERIOD = Number(t.dataset.period); render(); return; }
  if(t.dataset.countby){ COUNTBY = t.dataset.countby; render(); return; }
  if(t.dataset.open){ OPEN = t.dataset.open; EDITID = false; drawer(); return; }

  if(t.dataset.show){
    const parts = t.dataset.show.split("|");
    const l = getLead(parts[0]); if(!l) return;
    l.show = parts[1] === "1"; l.showAt = l.callDate || todayStr();
    if(l.show === false){ l.cierre = false; l.cierreAt = null; }
    await persist(l);
    if(l.show){ OPEN = l.id; drawer(); toast("Vino. Registra el resultado."); }
    else toast("Marcado: no se presentó.");
    return;
  }
  /* Devolver al pipeline a alguien archivado o cerrado al que has vuelto a tocar.
     Limpia el archivado Y el resultado de la llamada anterior: si vuelve, empieza
     un ciclo nuevo. Sus notas no se tocan — lo que ya sabes de él sigue valiendo. */
  if(t.dataset.revive){
    if(ROLE !== "setter"){ toast("Solo el setter devuelve leads al pipeline."); return; }
    const l = getLead(t.dataset.revive); if(!l) return;
    const tenia = [l.seed ? "archivado" : null,
                   l.cierre === true ? "cerrada como cliente" : null,
                   l.cierre === false ? "marcada como no cerró" : null,
                   (+l.importe > 0) ? money2(l.importe) : null].filter(Boolean).join(" · ");
    /* Los tags los manda ManyChat: si el terminal sigue puesto alli, el sync lo
       devolvera a Archivo pase lo que pase aqui. Hay que decirlo ANTES, no
       despues, o parece que el boton no funciona. */
    const terminal = tieneTag(l,"Tag Client") ? "Tag Client"
                   : esNoCerro(l)             ? "Tag Not Closed"
                   : esNoInteresado(l)        ? "Tag Not Interested" : null;
    const ok = await confirmar({
      titulo: "¿Devolver a @"+esc(l.handle)+" al pipeline?",
      texto: terminal
        ? "Se le borra el resultado anterior ("+(tenia || "archivado")+") y sus notas se conservan. " +
          "<b>Pero en ManyChat sigue con " + terminal + "</b>, y los tags los manda ManyChat: " +
          "el robot lo devolverá a Archivo en la próxima corrida. Quítale ese tag allí para que el cambio aguante."
        : "Ahora mismo está fuera ("+(tenia || "archivado")+"), así que tus toques no cuentan. " +
          "Al devolverlo vuelve a las colas y a las métricas, y se le borra el resultado de la llamada anterior. " +
          "Sus notas se conservan.",
      ok: terminal ? "Devolver igualmente" : "Devolver al pipeline"
    });
    if(!ok) return;
    Object.assign(l, {
      seed:false, agendo:null, agendoHora:"", agendoAt:null, callDate:null, pendingBook:false,
      show:null, showAt:null, cierre:null, cierreAt:null, importe:null, objecion:"", estado:"activo"
    });
    if(!l.touchedAt) l.touchedAt = todayStr();
    await persist(l); render();
    toast(terminal
      ? "@"+l.handle+" limpiado. Quítale "+terminal+" en ManyChat o volverá a Archivo."
      : "@"+l.handle+" vuelve al pipeline. Su toque ya cuenta.");
    return;
  }

  /* Desde el aviso de arriba o desde la ficha: pedir el importe que falta. */
  /* Quitar un toque anotado a mano. Hace falta porque estos no tienen ficha:
     si pegas mal un handle, sin esto no habria forma de corregirlo. */
  if(t.dataset.quitatoque){
    if(ROLE !== "setter"){ toast("Solo el setter edita los toques."); return; }
    const h = norm(t.dataset.quitatoque), T = todayStr();
    TOUCHMAN = Object.assign({}, TOUCHMAN);
    TOUCHMAN[T] = manualEn(T).filter(x => norm(x) !== h);
    if(!TOUCHMAN[T].length) delete TOUCHMAN[T];
    await persistMan();
    toast("Toque de @"+h+" quitado.");
    return;
  }
  if(t.dataset.askamount){
    const l = getLead(t.dataset.askamount); if(!l) return;
    await pedirImporte(l);
    return;
  }
  if(t.dataset.close){
    const parts = t.dataset.close.split("|");
    const l = getLead(parts[0]); if(!l) return;
    if(parts[1] === "x"){          /* deshacer: volver a preguntar */
      l.cierre = null; l.cierreAt = null; l.importe = null;
      if(l.estado === "cliente") l.estado = "activo";
      await persist(l); return;
    }
    l.cierre = parts[1] === "1";
    l.cierreAt = l.callDate || todayStr();
    /* Si hubo cierre o no-cierre, es porque la persona se presentó. */
    if(l.show !== true){ l.show = true; l.showAt = l.callDate || todayStr(); }
    if(l.cierre){ l.estado = "cliente"; }
    await persist(l);
    if(l.cierre) await pedirImporte(l);
    else { OPEN = l.id; drawer(); toast("No cerró. Marca la objeción."); }
    return;
  }
  if(t.dataset.saveamount){
    const l = getLead(t.dataset.saveamount); if(!l) return;
    const inp = document.querySelector('[data-amount="'+l.id+'"]');
    const v = inp ? Number(inp.value) : 0;
    if(!(v > 0)){ toast("Escribe el importe primero."); return; }
    l.importe = Math.round(v*100)/100;
    if(!l.cierreAt) l.cierreAt = l.callDate || todayStr();
    if(l.cierre === null){ l.cierre = true; l.estado = "cliente"; }
    await persist(l);
    toast(money2(l.importe)+" registrado.");
    return;
  }
  const act = t.dataset.act;
  if(!act) return;

  if(act === "closeDrawer"){ OPEN = null; EDITID = false; drawer(); return; }
  if(act === "editId"){
    if(ROLE !== "setter"){ toast("El @handle solo lo cambia el setter."); return; }
    EDITID = true; drawer(); setTimeout(() => { const el = document.getElementById("d_nombre"); if(el) el.focus(); }, 30); return;
  }
  if(act === "new"){
    /* Los leads entran solo por la sincronización de ManyChat o por Importar.
       A mano se crean fantasmas con el handle vacío que ensucian las tasas. */
    toast("Los leads entran desde Importar, no a mano.");
    VIEW = "importar"; render();
    return;
  }
  if(act === "archivar"){
    if(ROLE !== "setter"){ toast("Solo el setter archiva leads."); return; }
    const l = getLead(OPEN); if(!l) return;
    /* Archivar pregunta; sacar del archivo va directo — restaurar no destruye. */
    if(!l.seed){
      const ok = await confirmar({
        titulo: "¿Archivar @"+esc(l.handle)+"?",
        texto: "Deja de contar en todas las métricas y desaparece de Leads, Interesados y Llamadas. " +
               "Sus notas, importes y fechas se conservan, y puedes sacarlo del archivo cuando quieras.",
        ok: "Archivar", peligro: true
      });
      if(!ok) return;
    }
    l.seed = !l.seed;
    await persist(l);
    /* Al archivar se cierra la ficha: el lead ya no pertenece a esta pestaña y
       dejarla abierta sobre una lista donde ya no aparece confunde. Al sacarlo
       del archivo se queda abierta, que ahi si sigues trabajandolo. */
    if(l.seed) OPEN = null;
    drawer(); render();
    toast(l.seed
      ? "@"+l.handle+" archivado. Fuera de las métricas y de las colas; sus datos siguen ahí."
      : "@"+l.handle+" vuelve a contar.");
    return;
  }
  if(act === "reactivar"){
    /* Un cliente viejo que vuelve, o una agenda que nunca fue tuya. El sync no
       puede deshacer un cierre a proposito (protege al closer de que ManyChat
       le borre una venta real), asi que esto se hace a mano y solo el setter.
       Se limpia TODO el bloque de agenda y resultado a la vez: si se dejara uno
       suelto, el lead rebota entre Llamadas y la cola sin quedarse quieto. */
    if(ROLE !== "setter"){ toast("Solo el setter puede devolver un lead a la cola."); return; }
    const l = getLead(OPEN); if(!l) return;
    const tenia = [l.cierre === true ? "cierre" : null, l.show !== null ? "show" : null,
                   (+l.importe > 0) ? money2(l.importe) : null, l.agendo ? "agenda" : null]
                  .filter(Boolean).join(", ");
    const ok = await confirmar({
      titulo: "¿Devolver @"+esc(l.handle)+" a la cola?",
      texto: "Se le quita: <b>"+esc(tenia || "nada")+"</b>. " +
             "Sus notas (meta, dolor, ya hace) no se tocan.",
      ok: "Devolver a la cola", peligro: true
    });
    if(!ok) return;
    Object.assign(l, {
      agendo:null, agendoHora:"", agendoAt:null, callDate:null, pendingBook:false,
      show:null, showAt:null, cierre:null, cierreAt:null, importe:null,
      objecion:"", estado:"activo"
    });
    await persist(l); drawer(); render();
    toast("@"+l.handle+" vuelve a la cola.");
    return;
  }
  if(act === "startFresh"){ exitDemo(); render(); toast("Listo. Importa o añade tu primer lead."); return; }
  if(act === "export"){ await doExport(); return; }

  if(act === "parseCsv"){
    const fileEl = document.getElementById("csvFile");
    const pasted = (document.getElementById("csvPaste")||{}).value || "";
    if(fileEl && fileEl.files && fileEl.files[0]){
      const text = await fileEl.files[0].text();
      startImport(text);
    } else if(pasted.trim()){
      startImport(pasted);
    } else toast("Escoge un archivo o pega el CSV primero.");
    return;
  }
  if(act === "cancelImport"){ IMPORT = null; render(); return; }
  if(act === "doImport"){ await runImport(); return; }
  if(act === "addToque"){
    const inp = document.getElementById("tqHandle");
    const r = await registrarToque(inp ? inp.value : "");
    if(r.ok){ const i2 = document.getElementById("tqHandle"); if(i2){ i2.value = ""; i2.focus(); } }
    toast(r.msg);
    return;
  }
  if(act === "exportXlsx"){ await doExportXlsx(); return; }
});

/* Todos los tags en TRUE de esta fila, no solo el más alto. */
function rowTags(r){
  const stages = [], names = [];
  (IMPORT ? IMPORT.tags : []).forEach(t => {
    if(!isTrue(r[t.i])) return;
    names.push(t.header);
    if(t.stage) stages.push(t.stage);
  });
  return { stages, names };
}
/* El más avanzado — solo para etiquetar la fila en la vista previa. */
function rowStage(r){
  const st = rowTags(r).stages;
  return st.length ? st.slice().sort((a,b) => etapaRank(b) - etapaRank(a))[0] : "";
}
function startImport(text){
  const rows = parseCSV(text);
  if(rows.length < 2){ toast("Ese archivo no tiene filas suficientes."); return; }
  const headers = rows[0].map(h => String(h).trim());
  const body = rows.slice(1);
  const tags = [];
  headers.forEach((h,i) => { if(isTagCol(body, i)) tags.push({ i:i, header:h, stage: guessStage(h) }); });
  const map = guessMap(headers);
  Object.keys(map).forEach(k => {
    if(map[k] !== "" && tags.some(t => String(t.i) === map[k])) map[k] = "";
  });
  IMPORT = { headers, rows: body, map, tags };
  render();
}
async function runImport(){
  if(!IMPORT) return;
  const { rows, map } = IMPORT;
  const hIdx = map.handle === "" ? -1 : Number(map.handle);
  if(hIdx < 0){ toast("Falta escoger la columna del handle."); return; }
  const defFuente = (document.getElementById("impFuente")||{}).value || FUENTES[0];

  exitDemo();
  const existing = new Set(LEADS.map(l => norm(l.handle)));
  const out = [];
  rows.forEach(r => {
    const h = norm(r[hIdx]);
    if(!h || existing.has(h)) return;
    existing.add(h);
    const l = blankLead();
    l.handle = h;
    FIELDS.forEach(f => {
      if(f.k === "handle") return;
      const i = map[f.k] === "" ? -1 : Number(map[f.k]);
      if(i < 0) return;
      const v = String(r[i]||"").trim();
      if(!v) return;
      if(f.k === "fuente"){ l.fuente = FUENTES.includes(v) ? v : defFuente; }
      else l[f.k] = v;
    });
    if(!FUENTES.includes(l.fuente)) l.fuente = defFuente;
    if(!l.nombre) l.nombre = h;              // sin nombre en ManyChat → usa el username
    const rt = rowTags(r);
    applyTags(l, rt.stages, rt.names);       // los tags deciden dónde arranca en el embudo
    out.push(l);
  });
  if(!out.length){ toast("No había nada nuevo que importar."); IMPORT = null; render(); return; }
  await persistMany(out);
  IMPORT = null; VIEW = "hoy"; render();
  toast(out.length+" leads importados a la cola de hoy.");
}

/* campos del drawer + filtros + config */
document.addEventListener("change", async (e) => {
  const el = e.target;

  if(el.dataset && el.dataset.f){
    const l = getLead(OPEN); if(!l) return;
    const k = el.dataset.f;
    /* Un checkbox no lleva el estado en .value (ahi pone "on"), sino en .checked. */
    let v = el.type === "checkbox" ? el.checked : el.value;
    if(k === "show" || k === "cierre") v = v === "" ? null : v === "1";
    else if(k === "importe") v = v === "" ? null : Number(v);
    else if(k === "handle") v = norm(v);
    else if((k === "entry" || k === "callDate" || k === "agendo" || k === "agendoAt") && v === "") v = null;
    l[k] = v;
    /* Igual que en la fila de Hoy: no se confirma hasta tener dia Y hora. */
    if(k === "agendo"){
      l.callDate = v;
      l.pendingBook = !(v && l.agendoHora);
      if(v){ l.respondio = true; l.propuesta = true; }
    }
    if(k === "agendoHora"){
      l.pendingBook = !(l.agendo && v);
    }
    if(k === "cierre"){
      if(v === true){ l.cierreAt = todayStr(); l.estado = "cliente"; }
      else if(v === false){ l.cierreAt = todayStr(); }
      else l.cierreAt = null;
    }
    if(k === "show"){
      l.showAt = v === null ? null : (l.callDate || todayStr());
      if(v === false){ l.cierre = false; l.cierreAt = todayStr(); }
    }
    /* Un campo de texto no cambia la forma del panel: repintarlo destruiría el
       input al que el usuario acaba de hacer click. Solo se repinta cuando el
       cambio sí reordena el panel. */
    const estructural = (k === "show" || k === "cierre" || k === "agendo");
    SKIP_DRAWER = !estructural;
    await persist(l);
    SKIP_DRAWER = false;
    if(estructural) drawer();
    return;
  }

  if(el.dataset && el.dataset.cfg){
    const k = el.dataset.cfg;
    let v = Number(el.value);
    if(!isFinite(v) || v < 0) v = 0;
    CFG[k] = el.dataset.kind === "pct" ? v/100 : v;
    await persistCfg();
    return;
  }

  if(el.dataset && el.dataset.map !== undefined && IMPORT){
    IMPORT.map[el.dataset.map] = el.value; render(); return;
  }
  if(el.dataset && el.dataset.tag !== undefined && IMPORT){
    const t = IMPORT.tags.find(x => String(x.i) === el.dataset.tag);
    if(t){ t.stage = el.value; render(); }
    return;
  }
  /* Fecha y hora de la agenda, desde la fila de Hoy.
     La cita NO sale de "falta la fecha" hasta tener LAS DOS. Antes bastaba con
     la fecha: al escribirla, pendingBook pasaba a false, la fila saltaba de
     grupo en el mismo instante y el campo de la hora desaparecia debajo de los
     dedos, dejando la cita a medias y sin sitio donde terminarla. */
  if(el.dataset && el.dataset.callhora){
    const l = getLead(el.dataset.callhora); if(!l) return;
    l.agendoHora = el.value || "";
    l.pendingBook = !(l.agendo && l.agendoHora);
    await persist(l);
    if(el.value && l.agendo) toast("Agendada: "+fmtShort(l.agendo)+" a las "+fmtHora(el.value)+".");
    else if(el.value) toast("Hora puesta. Falta el día.");
    return;
  }
  if(el.dataset && el.dataset.calldate){
    const l = getLead(el.dataset.calldate); if(!l) return;
    if(!el.value){ l.agendo = null; l.callDate = null; l.pendingBook = true; await persist(l); return; }
    l.agendo = el.value; l.callDate = el.value;
    l.pendingBook = !(l.agendo && l.agendoHora);
    l.respondio = true; l.propuesta = true;
    await persist(l);
    if(l.agendoHora) toast("Agendada: "+fmtShort(el.value)+" a las "+fmtHora(l.agendoHora)+".");
    else toast("Día puesto. Escribe la hora para confirmarla.");
    return;
  }

  if(el.id === "festado"){ FILTERS.estado = el.value; render(); return; }
  if(el.id === "ffuente"){ FILTERS.fuente = el.value; render(); return; }
  if(el.id === "fbloque"){ FILTERS.bloque = el.value; render(); return; }
});

/* ---------- adaptador ----------
   Expone exactamente la misma forma que la app ya usaba, así los 10 sitios que
   tocan la base siguen escritos igual. Debajo habla Supabase. */
let CANAL = 0;
function makeDB(){
  function escuchar(tabla, fn){
    SB.channel("rt_" + tabla + "_" + (++CANAL))
      .on("postgres_changes", { event:"*", schema:"public", table:tabla }, fn)
      .subscribe();
  }
  return {
    collection(nombre){
      return {
        doc(id){
          return {
            async set(obj){
              /* UPDATE primero, INSERT solo si la fila no existe.
                 Con .upsert() PostgREST manda INSERT..ON CONFLICT, y eso hace que
                 Postgres evalue la politica de INSERT (solo setter). El closer se
                 estrellaba ahi y nunca llegaba al trigger guardia_leads, asi que no
                 podia ni marcar cierre ni escribir importe. Por la ruta de UPDATE
                 si pasa, y el trigger sigue decidiendo que campos puede tocar. */
              const ts = new Date().toISOString();
              const { data: actualizado, error: eUpd } = await SB.from(nombre)
                .update({ data:obj, updated_at:ts }).eq("id", id).select("id");
              if(eUpd) throw eUpd;
              if(actualizado && actualizado.length) return;
              const { error: eIns } = await SB.from(nombre)
                .insert({ id, data:obj, updated_at:ts });
              if(eIns) throw eIns;
            },
            async delete(){
              const { error } = await SB.from(nombre).delete().eq("id", id);
              if(error) throw error;
            }
          };
        },
        onSnapshot(cb, onErr){
          const traer = async () => {
            const { data, error } = await SB.from(nombre).select("id,data");
            if(error){ if(onErr) onErr(error); return; }
            cb({ docs: (data || []).map(r => ({ id:r.id, data: () => r.data })) });
          };
          traer(); escuchar(nombre, traer);
        }
      };
    },
    doc(ruta){
      const leer = async () => {
        const { data, error } = await SB.from("kv").select("data").eq("key", ruta).maybeSingle();
        if(error) throw error;
        return { exists: !!data, data: () => (data ? data.data : {}) };
      };
      return {
        get: leer,
        async set(obj){
          const { error } = await SB.from("kv")
            .upsert({ key:ruta, data:obj, updated_at:new Date().toISOString() });
          if(error) throw error;
        },
        onSnapshot(cb, onErr){
          const traer = () => leer().then(cb).catch(e => { if(onErr) onErr(e); });
          traer(); escuchar("kv", traer);
        }
      };
    }
  };
}

/* La app pide sus capacidades con claude.use(). Se las damos nosotros:
   la base sale de Supabase y la descarga es un blob normal del navegador.
   Así los sitios que llaman a claude.use() no cambian ni una letra. */
const DBADAPTER = makeDB();
const claude = {
  async use(qué){
    if(qué === "db") return DBADAPTER;
    if(qué === "downloads") return {
      async save({ filename, data }){
        const blob = data instanceof Blob ? data : new Blob([data]);
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        return { status:"saved" };
      }
    };
    return null;
  }
};

     recargar lo encuentra y te vuelve a meter dentro. Por eso, pase lo que

  const limpiar = () => {

/* Cursor de adsbyblitz.com. La web lo mueve con GSAP; aqui no hay GSAP, asi que
   el punto va con transform directo y el anillo persigue con una interpolacion
   en cada frame. Solo se enciende en el login y solo si hay raton de verdad. */
function cursorLogin(){
  if(cursorLogin.listo) return;
  if(!window.matchMedia || !window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
  const pt = document.getElementById("gateCur"), ring = document.getElementById("gateRing");
  if(!pt || !ring) return;
  cursorLogin.listo = true;
  let x = innerWidth/2, y = innerHeight/2, rx = x, ry = y, visto = false;
  addEventListener("mousemove", (e) => {
    x = e.clientX; y = e.clientY;
    if(!visto){ visto = true; rx = x; ry = y; }
    pt.style.transform = "translate("+x+"px,"+y+"px) translate(-50%,-50%)";
  }, {passive:true});
  (function frame(){
    rx += (x - rx) * 0.10; ry += (y - ry) * 0.10;
    ring.style.transform = "translate("+rx+"px,"+ry+"px) translate(-50%,-50%)";
    requestAnimationFrame(frame);
  })();
  /* Delegado: los campos y el boton existen desde el principio, pero asi
     tampoco importa si algo se repinta despues. */
  const gateEl = document.getElementById("gate");
  const marca = (on) => (e) => {
    if(!e.target.closest || !e.target.closest("input,button,a")) return;
    pt.classList.toggle("hover", on); ring.classList.toggle("hover", on);
  };
  gateEl.addEventListener("mouseover", marca(true));
  gateEl.addEventListener("mouseout", marca(false));
}

})();
