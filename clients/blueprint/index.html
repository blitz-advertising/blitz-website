  {k:"meta", lab:"Meta (sus palabras)"},
  {k:"dolor", lab:"Dolor (sus palabras)"},
  {k:"yaHace", lab:"Ya hace"}
];

/* --- etapas del embudo a las que se puede mapear un tag --- */
const ETAPAS = [
  {k:"",           lab:"— no usar —",              rank:-1},
  {k:"muerto",     lab:"No interesado",            rank:0.5},
  {k:"contesto",   lab:"Contestó · hay conversación", rank:1},
  {k:"dolor",      lab:"Ya soltó el dolor",        rank:2},
  {k:"calificado", lab:"Calificado",               rank:3},
  {k:"vsl",        lab:"VSL · vía alterna",        rank:3.5},
  {k:"propuesta",  lab:"Le mandé el link",         rank:4},
  {k:"agendo",     lab:"Agendó",                   rank:5},
  {k:"cliente",    lab:"Cliente · pagó",           rank:6}
];
const etapaRank = k => (ETAPAS.find(e => e.k === k) || {rank:-1}).rank;

function guessStage(h){
  const s = String(h||"").toLowerCase();
  if(/no\s*inter|not\s*inter/.test(s)) return "muerto";
  /* "Not Closed" = estuvo en la llamada y no cerró. Llegó hasta agendó, no es un muerto. */
  if(/not\s*clos|no\s*cerr/.test(s))     return "agendo";
  if(/build\s*up|buildup/.test(s))     return "dolor";
  if(/vsl/.test(s))                    return "vsl";
  if(/link/.test(s))                   return "propuesta";
  if(/book/.test(s))                   return "agendo";
  if(/client|cliente/.test(s))         return "cliente";
  if(/warm/.test(s))                   return "calificado";
  if(/lead/.test(s))                   return "calificado";
  if(/interes|interest/.test(s))       return "contesto";
  return "";
}

const TRUEW = ["true","verdadero","1","sí","si","yes","x","v"];
const BOOLW = TRUEW.concat(["false","falso","0","no","n","-"]);
function isTrue(v){ return TRUEW.indexOf(String(v==null?"":v).trim().toLowerCase()) >= 0; }
function isTagCol(rows, i){
  let seen = 0;
  for(const r of rows){
    const v = String(r[i]==null?"":r[i]).trim().toLowerCase();
    if(v === "") continue;
    if(BOOLW.indexOf(v) < 0) return false;
    seen++;
  }
  return seen > 0;
}

/* Un contacto puede traer VARIOS tags de ManyChat — se aplican todos, no gana uno solo.
   Lo que sí manda el más avanzado es el bloque alcanzado.
   No se ponen fechas: lo que pasó antes de importar no tiene fecha real, así que
   estos leads quedan marcados como arrastre y fuera de las tasas. */
/* Un tag "Src ..." / "Fuente ..." no es una etapa: dice por dónde entró la persona.
   ManyChat no guarda el punto de entrada por su cuenta, así que esto solo funciona
   si el flow de cada trigger le pone su tag al contacto. */
const SRC_RE = /^(src|source|fuente|entrada|origen)\b[\s:_-]*/i;
const SRC_MAP = [
  [/coment|comment|keyword|palabra/i, "Comentario/Keyword"],
  [/story|historia|stories/i,         "Story reply"],
  [/refer|referral|referido/i,        "Referido"],
  [/outbound|out\b|frio|cold/i,       "Outbound DM"],
  [/inbound|dm|mensaje|in\b/i,        "Inbound DM"],
  [/bienven|welcome|ad\b|anuncio/i,   "Bienvenida"]
];
function srcFromTag(t){
  const limpio = tagName(t);          /* "Tag Src Story" -> "Src Story" */
  if(!SRC_RE.test(limpio)) return "";
  const resto = limpio.replace(SRC_RE,"").trim();
  if(!resto) return "";
  for(const [re, val] of SRC_MAP) if(re.test(resto)) return val;
  return resto;   /* no lo reconozco: lo guardo tal cual en vez de inventar */
}
function applyTags(l, stages, tagNames){
  if(!stages.length && !(tagNames||[]).some(srcFromTag)) return;
  l.seed = true;
  l.tags = tagNames || [];
  l.respondio = true;
  (tagNames || []).forEach(t => { const f = srcFromTag(t); if(f) l.fuente = f; });
  if(!stages.length) return;

  let top = 1;
  /* de menor a mayor: si alguien viene con "No interesado" Y "Cliente", gana Cliente */
  stages.slice().sort((a,b) => etapaRank(a) - etapaRank(b)).forEach(st => {
    const rk = etapaRank(st);
    if(rk > top && st !== "vsl" && st !== "muerto") top = rk;
    if(st === "vsl"){ l.via = "VSL"; if(top < 3) top = 3; }  /* el VSL ya es filtro, pero nunca sube más */
    else if(st === "muerto"){ l.estado = "muerto"; }
    else if(st === "propuesta"){ l.propuesta = true; }
    else if(st === "agendo"){ l.propuesta = true; l.pendingBook = true; l.estado = "activo"; }
    else if(st === "cliente"){
      l.propuesta = true; l.show = true; l.cierre = true;
      l.estado = "cliente"; l.pendingBook = false;
    }
  });
  /* Un tag NO prueba que corriste un bloque del guion. "Interest" o "Lead" dicen
     qué tan caliente está la persona, no que le sacaste la meta o el dolor —
     eso solo lo prueban tus notas. Lo único que un tag sí prueba es que el link
     salió (Link, Booked, Not Closed, Client), y eso es Pre-call de verdad. */
  l.blockFloor = top >= 4 ? BLOQUES[4] : "";
}

      (hIdx < 0 ? '<div class="banner"><p>Escoge la columna del <b>@handle</b> para poder continuar.</p></div>' :
        '<div class="banner '+(dupes||blanks?"":"info")+'"><p><b>'+nuevos+' se van a importar.</b>' +

          (blanks?' '+blanks+' se saltan por venir sin handle.':'') + '</p></div>' +

        '<button class="btn ghost" data-act="cancelImport">Cancelar</button>');
  }
  return modeBanner() + '<div class="section">' +
    '<div class="h-row"><h2>Importar</h2><span class="sub">Desde el Sheet de ManyChat</span></div>' + body + '</div>';
}

function parseCSV(text){
  const rows = []; let row = [], cur = "", q = false;
  text = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  /* Copiar y pegar desde Google Sheets da tabuladores, no comas. */
  const head = text.split("\n")[0] || "";
  const SEP = (head.split("\t").length > head.split(",").length) ? "\t" : ",";
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else {
      if(c === '"') q = true;
      else if(c === SEP){ row.push(cur); cur = ""; }
      else if(c === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; }
      else cur += c;
    }
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ""));
}
function guessMap(headers){
  const map = {}; FIELDS.forEach(f => map[f.k] = "");
  const find = (...pats) => {
    for(let i=0;i<headers.length;i++){
      const h = headers[i].toLowerCase().trim();
      if(pats.some(p => h.includes(p))) return String(i);
    }
    return "";
  };
  map.handle = find("handle","username","user name","instagram","usuario","ig ","@");
  map.fuente = find("fuente","source","origen","canal","flow");
  map.nombre = find("nombre","name","first");
  map.meta   = find("meta","goal","objetivo");
  map.dolor  = find("dolor","pain","problema");
  return map;
}
function normDate(s){
  if(!s) return null;
  s = String(s).trim();
  let mm = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(mm) return mm[1]+"-"+mm[2]+"-"+mm[3];
  mm = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(mm) return mm[3]+"-"+pad(mm[2])+"-"+pad(mm[1]);
  const d = new Date(s);
  if(!isNaN(d.getTime())) return iso(d);
  return null;
}
function leadsToCSV(){
  const cols = ["handle","nombre","fuente","entry","block","respondio","respondioAt","propuesta","propuestaAt",
    "agendo","agendoAt","callDate","show","cierre","cierreAt","oferta","importe","objecion","estado","meta","dolor","comentarios"];
  const head = ["Handle","Nombre","Fuente","Fecha entrada","Bloque","Respondió","Fecha respondió","Propuesta","Fecha propuesta",
    "Fecha agendada","Fecha agendó","Fecha llamada","Show","Cierre","Fecha cierre","Oferta","Importe","Objeción","Estado","Meta","Dolor","Comentarios"];
  const q = v => { const s = v===null||v===undefined?"":String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [head.join(",")];
  LEADS.forEach(l => lines.push(cols.map(c => {
    let v = l[c];
    if(c === "handle") v = "@"+l.handle;
    if(v === true) v = "Sí"; if(v === false) v = "No";
    return q(v);
  }).join(",")));
  return lines.join("\n");
}
async function doExport(){
  const csv = leadsToCSV();
  const dl = await claude.use("downloads");
  if(!dl){ toast("La descarga no está disponible en esta vista."); return; }
  try{
    await dl.save({ filename:"blueprint-leads-"+todayStr()+".csv", data:csv });
    toast("CSV guardado.");
  }catch(e){
    if(e && e.code === "declined") return;
    toast("No se pudo descargar el CSV.");
  }
}

/* --- Escritor de .xlsx propio ---------------------------------------------
   Un .xlsx es un ZIP con XML adentro. Lo armamos a mano (unas 90 líneas) en vez
   de cargar una librería de 900 KB desde un CDN: así el artifact es autónomo y
   la exportación funciona aunque el CDN esté caído o bloqueado. */
const XML_ESC = t => String(t).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"})[c]);
function colName(i){ let s=""; i++; while(i>0){ const r=(i-1)%26; s=String.fromCharCode(65+r)+s; i=(i-r-1)/26; } return s; }
const CRCT = (() => { const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRCT[(c ^ u8[i]) & 0xFF] ^ (c>>>8); return (c ^ 0xFFFFFFFF)>>>0; }
function zip(files){
  const enc = new TextEncoder();
  const parts = [], dir = []; let off = 0;
  const u16 = n => [n & 255, (n>>>8) & 255];
  const u32 = n => [n & 255, (n>>>8) & 255, (n>>>16) & 255, (n>>>24) & 255];
  files.forEach(f => {
    const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    const head = [].concat([0x50,0x4B,3,4], u16(20), u16(0x800), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
    parts.push(new Uint8Array(head), name, data);
    dir.push({ name, crc, len:data.length, off });
    off += head.length + name.length + data.length;
  });
  const cd = [];
  dir.forEach(d => {
    const head = [].concat([0x50,0x4B,1,2], u16(20), u16(20), u16(0x800), u16(0), u16(0), u16(0),
      u32(d.crc), u32(d.len), u32(d.len), u16(d.name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(d.off));
    cd.push(new Uint8Array(head), d.name);
  });
  const cdLen = cd.reduce((a,x) => a + x.length, 0);
  const eocd = new Uint8Array([].concat([0x50,0x4B,5,6], u16(0), u16(0),
    u16(dir.length), u16(dir.length), u32(cdLen), u32(off), u16(0)));
  const all = parts.concat(cd, [eocd]);
  const total = all.reduce((a,x) => a + x.length, 0);
  const out = new Uint8Array(total); let q = 0;
  all.forEach(x => { out.set(x, q); q += x.length; });
  return out;
}
/* s=1 título, s=2 cabecera de grupo, s=3 cabecera de columna */
function sheetXML(aoa, anchos){
  const cols = anchos ? '<cols>' + anchos.map((w,i) =>
    '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join("") + '</cols>' : "";
  const rows = aoa.map((row, r) => {
    const st = r === 0 ? 1 : (r === 2 || r === 3 || r === 4) ? 3 : 0;
    const cells = (row||[]).map((v, c) => {
      if(v === null || v === undefined || v === "") return "";
      const ref = colName(c) + (r+1);
      const sa = st ? ' s="'+st+'"' : "";
      return (typeof v === "number" && isFinite(v))
        ? '<c r="'+ref+'"'+sa+'><v>'+v+'</v></c>'
        : '<c r="'+ref+'"'+sa+' t="inlineStr"><is><t xml:space="preserve">'+XML_ESC(v)+'</t></is></c>';
    }).join("");
    return cells ? '<row r="'+(r+1)+'">'+cells+'</row>' : "";
  }).join("");
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    cols + '<sheetData>' + rows + '</sheetData></worksheet>';
}

/* ===================== render ===================== */
/* Al guardar un campo se vuelve a pintar todo. Sin esto el navegador pierde el
   scroll y "la carta se sube" justo cuando terminas de escribir. */
let SKIP_DRAWER = false;
/* La sincronización escribe cada pocas horas y dispara un re-render. Si en ese
   momento el closer está escribiendo un importe, reconstruir el panel le borra
   lo que lleva tecleado — el valor no se guarda hasta que suelta el campo.
   Mientras tenga el foco adentro, el panel no se toca. */
function focoEnDrawer(){
  try{
    const a = document.activeElement;
    return !!(a && a.closest && a.closest(".drawer"));
  }catch(_){ return false; }
}
function render(){
  if(!viewOk(VIEW)) VIEW = navs()[0].k;   // el closer no entra a las vistas del setter
  const y = (typeof window !== "undefined" && window.scrollY) || 0;
  renderNav();
  const v = document.getElementById("view");
  v.innerHTML = VIEW === "hoy" ? viewHoy()
    : VIEW === "leads" ? viewLeads()
    : VIEW === "llamadas" ? viewLlamadas()
    : VIEW === "numeros" ? viewNumeros()
    : VIEW === "exportar" ? viewExportar()
    : viewImportar();
  if(!SKIP_DRAWER && !focoEnDrawer()) drawer();
  if(y && typeof window !== "undefined" && window.scrollTo) window.scrollTo(0, y);
}
let TOAST_T = null;
function toast(msg){
  const h = document.getElementById("toastHost");
  h.innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(TOAST_T);
  TOAST_T = setTimeout(() => { h.innerHTML = ""; }, 3200);
}

/* ===================== eventos ===================== */
function getLead(id){ return LEADS.find(l => l.id === id); }

document.addEventListener("click", async (e) => {
  const t = e.target.closest("button");
  if(!t) return;

  if(t.dataset.nav){ if(viewOk(t.dataset.nav)) VIEW = t.dataset.nav; OPEN = null; render(); window.scrollTo(0,0); return; }
  if(t.dataset.role){
    if(ROL_REAL !== "setter") return;     /* el rol lo manda la base */
    ROLE = t.dataset.role; try{ localStorage.setItem(LS_ROLE, ROLE); }catch(_){}
    VIEW = ROLE === "closer" ? "llamadas" : "hoy"; render(); return; }
  if(t.dataset.period !== undefined && t.dataset.period !== ""){ PERIOD = Number(t.dataset.period); render(); return; }
  if(t.dataset.countby){ COUNTBY = t.dataset.countby; render(); return; }
  if(t.dataset.open){ OPEN = t.dataset.open; EDITID = false; drawer(); return; }

  if(t.dataset.show){
    const parts = t.dataset.show.split("|");
    const l = getLead(parts[0]); if(!l) return;
    l.show = parts[1] === "1"; l.showAt = l.callDate || todayStr();
    if(l.show === false){ l.cierre = false; l.cierreAt = null; }
    await persist(l);
    if(l.show){ OPEN = l.id; drawer(); toast("Vino. Registra el resultado."); }
    else toast("Marcado: no se presentó.");
    return;
  }
  if(t.dataset.close){
    const parts = t.dataset.close.split("|");
    const l = getLead(parts[0]); if(!l) return;
    if(parts[1] === "x"){          /* deshacer: volver a preguntar */
      l.cierre = null; l.cierreAt = null; l.importe = null;
      if(l.estado === "cliente") l.estado = "activo";
      await persist(l); return;
    }
    l.cierre = parts[1] === "1";
    l.cierreAt = l.callDate || todayStr();
    /* Si hubo cierre o no-cierre, es porque la persona se presentó. */
    if(l.show !== true){ l.show = true; l.showAt = l.callDate || todayStr(); }
    if(l.cierre){ l.estado = "cliente"; }
    await persist(l);
    if(l.cierre){
      toast("Cerró. Escribe cuánto pagó.");
      /* el input del importe aparece en la misma fila: le damos el foco */
      setTimeout(() => { const i = document.querySelector('[data-amount="'+l.id+'"]'); if(i) i.focus(); }, 30);
    } else { OPEN = l.id; drawer(); toast("No cerró. Marca la objeción."); }
    return;
  }
  if(t.dataset.saveamount){
    const l = getLead(t.dataset.saveamount); if(!l) return;
    const inp = document.querySelector('[data-amount="'+l.id+'"]');
    const v = inp ? Number(inp.value) : 0;
    if(!(v > 0)){ toast("Escribe el importe primero."); return; }
    l.importe = Math.round(v*100)/100;
    if(!l.cierreAt) l.cierreAt = l.callDate || todayStr();
    if(l.cierre === null){ l.cierre = true; l.estado = "cliente"; }
    await persist(l);
    toast(money2(l.importe)+" registrado.");
    return;
  }
  const act = t.dataset.act;
  if(!act) return;

  if(act === "closeDrawer"){ OPEN = null; EDITID = false; drawer(); return; }
  if(act === "editId"){
    if(ROLE !== "setter"){ toast("El @handle solo lo cambia el setter."); return; }
    EDITID = true; drawer(); setTimeout(() => { const el = document.getElementById("d_nombre"); if(el) el.focus(); }, 30); return;
  }
  if(act === "new"){
    /* Los leads entran solo por la sincronización de ManyChat o por Importar.
       A mano se crean fantasmas con el handle vacío que ensucian las tasas. */
    toast("Los leads entran desde Importar, no a mano.");
    VIEW = "importar"; render();
    return;
  }
  if(act === "delLead"){
    /* Borrar un lead rompe el enlace con ManyChat y no se puede deshacer.
       Es del setter, aunque el botón no esté a la vista. */
    if(ROLE !== "setter"){ toast("Solo el setter puede borrar leads."); return; }
    const l = getLead(OPEN); if(!l) return;
    if(!confirm("¿Borrar @"+l.handle+"? No se puede deshacer.")) return;
    await removeLead(l.id); OPEN = null; drawer(); toast("Lead borrado.");
    return;
  }
  if(act === "startFresh"){ exitDemo(); render(); toast("Listo. Importa o añade tu primer lead."); return; }
  if(act === "export"){ await doExport(); return; }

  if(act === "parseCsv"){
    const fileEl = document.getElementById("csvFile");
    const pasted = (document.getElementById("csvPaste")||{}).value || "";
    if(fileEl && fileEl.files && fileEl.files[0]){
      const text = await fileEl.files[0].text();
      startImport(text);
    } else if(pasted.trim()){
      startImport(pasted);
    } else toast("Escoge un archivo o pega el CSV primero.");
    return;
  }
  if(act === "cancelImport"){ IMPORT = null; render(); return; }
  if(act === "doImport"){ await runImport(); return; }
  if(act === "addToque"){
    const inp = document.getElementById("tqHandle");
    const r = await registrarToque(inp ? inp.value : "");
    if(r.ok){ const i2 = document.getElementById("tqHandle"); if(i2){ i2.value = ""; i2.focus(); } }
    toast(r.msg);
    return;
  }
  if(act === "exportXlsx"){ await doExportXlsx(); return; }
});

/* Todos los tags en TRUE de esta fila, no solo el más alto. */
function rowTags(r){
  const stages = [], names = [];
  (IMPORT ? IMPORT.tags : []).forEach(t => {
    if(!isTrue(r[t.i])) return;
    names.push(t.header);
    if(t.stage) stages.push(t.stage);
  });
  return { stages, names };
}
/* El más avanzado — solo para etiquetar la fila en la vista previa. */
function rowStage(r){
  const st = rowTags(r).stages;
  return st.length ? st.slice().sort((a,b) => etapaRank(b) - etapaRank(a))[0] : "";
}
function startImport(text){
  const rows = parseCSV(text);
  if(rows.length < 2){ toast("Ese archivo no tiene filas suficientes."); return; }
  const headers = rows[0].map(h => String(h).trim());
  const body = rows.slice(1);
  const tags = [];
  headers.forEach((h,i) => { if(isTagCol(body, i)) tags.push({ i:i, header:h, stage: guessStage(h) }); });
  const map = guessMap(headers);
  Object.keys(map).forEach(k => {
    if(map[k] !== "" && tags.some(t => String(t.i) === map[k])) map[k] = "";
  });
  IMPORT = { headers, rows: body, map, tags };
  render();
}
async function runImport(){
  if(!IMPORT) return;
  const { rows, map } = IMPORT;
  const hIdx = map.handle === "" ? -1 : Number(map.handle);
  if(hIdx < 0){ toast("Falta escoger la columna del handle."); return; }
  const defFuente = (document.getElementById("impFuente")||{}).value || FUENTES[0];

  exitDemo();
  const existing = new Set(LEADS.map(l => norm(l.handle)));
  const out = [];
  rows.forEach(r => {
    const h = norm(r[hIdx]);
    if(!h || existing.has(h)) return;
    existing.add(h);
    const l = blankLead();
    l.handle = h;
    FIELDS.forEach(f => {
      if(f.k === "handle") return;
      const i = map[f.k] === "" ? -1 : Number(map[f.k]);
      if(i < 0) return;
      const v = String(r[i]||"").trim();
      if(!v) return;
      if(f.k === "fuente"){ l.fuente = FUENTES.includes(v) ? v : defFuente; }
      else l[f.k] = v;
    });
    if(!FUENTES.includes(l.fuente)) l.fuente = defFuente;
    if(!l.nombre) l.nombre = h;              // sin nombre en ManyChat → usa el username
    const rt = rowTags(r);
    applyTags(l, rt.stages, rt.names);       // los tags deciden dónde arranca en el embudo
    out.push(l);
  });
  if(!out.length){ toast("No había nada nuevo que importar."); IMPORT = null; render(); return; }
  await persistMany(out);
  IMPORT = null; VIEW = "hoy"; render();
  toast(out.length+" leads importados a la cola de hoy.");
}

/* campos del drawer + filtros + config */
document.addEventListener("change", async (e) => {
  const el = e.target;

  if(el.dataset && el.dataset.f){
    const l = getLead(OPEN); if(!l) return;
    const k = el.dataset.f;
    let v = el.value;
    if(k === "show" || k === "cierre") v = v === "" ? null : v === "1";
    else if(k === "importe") v = v === "" ? null : Number(v);
    else if(k === "handle") v = norm(v);
    else if((k === "entry" || k === "callDate" || k === "agendo" || k === "agendoAt") && v === "") v = null;
    l[k] = v;
    if(k === "agendo"){
      l.callDate = v;
      l.pendingBook = !v;
      if(v){ l.respondio = true; l.propuesta = true; }
    }
    if(k === "cierre"){
      if(v === true){ l.cierreAt = todayStr(); l.estado = "cliente"; }
      else if(v === false){ l.cierreAt = todayStr(); }
      else l.cierreAt = null;
    }
    if(k === "show"){
      l.showAt = v === null ? null : (l.callDate || todayStr());
      if(v === false){ l.cierre = false; l.cierreAt = todayStr(); }
    }
    /* Un campo de texto no cambia la forma del panel: repintarlo destruiría el
       input al que el usuario acaba de hacer click. Solo se repinta cuando el
       cambio sí reordena el panel. */
    const estructural = (k === "show" || k === "cierre" || k === "agendo");
    SKIP_DRAWER = !estructural;
    await persist(l);
    SKIP_DRAWER = false;
    if(estructural) drawer();
    return;
  }

  if(el.dataset && el.dataset.cfg){
    const k = el.dataset.cfg;
    let v = Number(el.value);
    if(!isFinite(v) || v < 0) v = 0;
    CFG[k] = el.dataset.kind === "pct" ? v/100 : v;
    await persistCfg();
    return;
  }

  if(el.dataset && el.dataset.map !== undefined && IMPORT){
    IMPORT.map[el.dataset.map] = el.value; render(); return;
  }
  if(el.dataset && el.dataset.tag !== undefined && IMPORT){
    const t = IMPORT.tags.find(x => String(x.i) === el.dataset.tag);
    if(t){ t.stage = el.value; render(); }
    return;
  }
  if(el.dataset && el.dataset.callhora){
    const l = getLead(el.dataset.callhora); if(!l) return;
    l.agendoHora = el.value || "";
    await persist(l);
    if(el.value) toast("Llamada a las "+fmtHora(el.value)+".");
    return;
  }
  if(el.dataset && el.dataset.calldate){
    const l = getLead(el.dataset.calldate); if(!l) return;
    if(!el.value){ l.agendo = null; l.callDate = null; await persist(l); return; }
    l.agendo = el.value; l.callDate = el.value; l.pendingBook = false;
    l.respondio = true; l.propuesta = true;
    await persist(l);
    toast("Llamada para el "+fmtShort(el.value)+".");
    return;
  }

  if(el.id === "festado"){ FILTERS.estado = el.value; render(); return; }
  if(el.id === "ffuente"){ FILTERS.fuente = el.value; render(); return; }
  if(el.id === "fbloque"){ FILTERS.bloque = el.value; render(); return; }
});

const SB = window.supabase.createClient(SB_URL, SB_KEY, {
  auth: { persistSession: true, autoRefreshToken: true }
});

/* El rol REAL, el que dice la base. ROLE es solo la vista que se está mirando. */
let ROL_REAL = "closer";

/* ---------- adaptador ----------
   Expone exactamente la misma forma que la app ya usaba, así los 10 sitios que
   tocan la base siguen escritos igual. Debajo habla Supabase. */
let CANAL = 0;
function makeDB(){
  function escuchar(tabla, fn){
    SB.channel("rt_" + tabla + "_" + (++CANAL))
      .on("postgres_changes", { event:"*", schema:"public", table:tabla }, fn)
      .subscribe();
  }
  return {
    collection(nombre){
      return {
        doc(id){
          return {
            async set(obj){
              /* UPDATE primero, INSERT solo si la fila no existe.
                 Con .upsert() PostgREST manda INSERT..ON CONFLICT, y eso hace que
                 Postgres evalue la politica de INSERT (solo setter). El closer se
                 estrellaba ahi y nunca llegaba al trigger guardia_leads, asi que no
                 podia ni marcar cierre ni escribir importe. Por la ruta de UPDATE
                 si pasa, y el trigger sigue decidiendo que campos puede tocar. */
              const ts = new Date().toISOString();
              const { data: actualizado, error: eUpd } = await SB.from(nombre)
                .update({ data:obj, updated_at:ts }).eq("id", id).select("id");
              if(eUpd) throw eUpd;
              if(actualizado && actualizado.length) return;
              const { error: eIns } = await SB.from(nombre)
                .insert({ id, data:obj, updated_at:ts });
              if(eIns) throw eIns;
            },
            async delete(){
              const { error } = await SB.from(nombre).delete().eq("id", id);
              if(error) throw error;
            }
          };
        },
        onSnapshot(cb, onErr){
          const traer = async () => {
            const { data, error } = await SB.from(nombre).select("id,data");
            if(error){ if(onErr) onErr(error); return; }
            cb({ docs: (data || []).map(r => ({ id:r.id, data: () => r.data })) });
          };
          traer(); escuchar(nombre, traer);
        }
      };
    },
    doc(ruta){
      const leer = async () => {
        const { data, error } = await SB.from("kv").select("data").eq("key", ruta).maybeSingle();
        if(error) throw error;
        return { exists: !!data, data: () => (data ? data.data : {}) };
      };
      return {
        get: leer,
        async set(obj){
          const { error } = await SB.from("kv")
            .upsert({ key:ruta, data:obj, updated_at:new Date().toISOString() });
          if(error) throw error;
        },
        onSnapshot(cb, onErr){
          const traer = () => leer().then(cb).catch(e => { if(onErr) onErr(e); });
          traer(); escuchar("kv", traer);
        }
      };
    }
  };
}

/* La app pide sus capacidades con claude.use(). Se las damos nosotros:
   la base sale de Supabase y la descarga es un blob normal del navegador.
   Así los sitios que llaman a claude.use() no cambian ni una letra. */
const DBADAPTER = makeDB();
const claude = {
  async use(qué){
    if(qué === "db") return DBADAPTER;
    if(qué === "downloads") return {
      async save({ filename, data }){
        const blob = data instanceof Blob ? data : new Blob([data]);
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        return { status:"saved" };
      }
    };
    return null;
  }
};
