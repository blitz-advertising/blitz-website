<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>Blitz — Delivery</title>
<link rel="icon" href="/assets/blitz-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   BLITZ — DELIVERY PAGE
   One template. Everything on the page comes from project.json
   sitting next to this file. Never edit this file per job.
   ============================================================ */

@font-face{
  font-family:'Padaloma';
  src:url('/assets/padaloma.italic.ttf') format('truetype');
  font-style:italic; font-display:swap;
}

:root{
  --bg:#010205;
  --white:#fff;
  --blue:#1f48c8;
  --blue-bright:#3a66e0;
  --blue-glow:rgba(77,126,212,.32);
  --border:rgba(255,255,255,.08);
  --border-mid:rgba(255,255,255,.14);
  --muted:rgba(255,255,255,.38);
  --muted-mid:rgba(255,255,255,.58);
  --font-display:'Padaloma',Georgia,serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --ease-out:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--white);
  font-family:var(--font-body); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 520px at 12% -10%, rgba(31,72,200,.18), transparent 62%),
    radial-gradient(760px 440px at 92% 2%, rgba(58,102,224,.10), transparent 58%);
  background-repeat:no-repeat;
}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:inherit}

.wrap{max-width:920px;margin:0 auto;padding:0 24px 96px}

/* ---------- header ---------- */
.top{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:28px 0 0;
}
.top img{height:22px;width:auto;opacity:.92}
.stamp{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);
}

.head{padding:72px 0 56px;border-bottom:1px solid var(--border)}
.eyebrow{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--blue-bright);margin-bottom:20px;
}
.client{
  font-family:var(--font-display);font-style:italic;
  font-size:clamp(38px,7vw,64px);line-height:1.02;margin:0;
}
.project{
  font-size:clamp(17px,2.4vw,21px);color:var(--muted-mid);
  margin:14px 0 0;font-weight:400;
}

/* ---------- the download block ---------- */
.deliver{
  margin:40px 0 0;padding:32px;border-radius:14px;
  border:1px solid var(--border-mid);
  background:linear-gradient(180deg,rgba(31,72,200,.10),rgba(255,255,255,.015));
}
.deliver-label{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:18px;
}
.btn{
  display:inline-flex;align-items:center;gap:12px;
  padding:17px 30px;border-radius:10px;border:0;
  background:var(--blue);color:#fff;text-decoration:none;
  font-family:var(--font-body);font-size:15px;font-weight:600;letter-spacing:.01em;
  box-shadow:0 0 0 1px rgba(255,255,255,.10) inset, 0 10px 30px -12px var(--blue-glow);
  transition:background .3s var(--ease-out), transform .3s var(--ease-out);
}
.btn:hover{background:var(--blue-bright);transform:translateY(-1px)}
.btn svg{width:16px;height:16px;flex:none}
.expiry{
  font-family:var(--font-mono);font-size:12px;color:var(--muted);
  margin-top:16px;
}
.expiry b{color:var(--muted-mid);font-weight:500}

/* expired state — reads as intentional, not broken */
.expired{
  display:inline-flex;align-items:center;gap:12px;
  padding:17px 30px;border-radius:10px;
  border:1px solid var(--border-mid);background:rgba(255,255,255,.03);
  color:var(--muted-mid);text-decoration:none;font-weight:500;
  transition:border-color .3s var(--ease-out),color .3s var(--ease-out);
}
.expired:hover{border-color:var(--border-mid);color:var(--white)}

/* ---------- what's inside ---------- */
.sect{padding:56px 0 0}
.sect-label{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
  padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:6px;
}
.row{
  display:flex;align-items:baseline;justify-content:space-between;gap:20px;
  padding:16px 0;border-bottom:1px solid var(--border);
}
.row-item{flex:1}
.row-qty{
  font-family:var(--font-mono);font-size:14px;color:var(--muted-mid);
  flex:none;font-variant-numeric:tabular-nums;
}

/* the headline number — variation count does the invoice's arguing */
.total{
  display:flex;align-items:baseline;gap:16px;
  padding:26px 0 0;
}
.total-num{
  font-family:var(--font-mono);font-size:44px;font-weight:500;
  line-height:1;color:var(--white);font-variant-numeric:tabular-nums;
}
.total-txt{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}

/* ---------- scope ---------- */
.scope{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:1px;background:var(--border);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;margin-top:12px;
}
.cell{background:var(--bg);padding:22px 20px}
.cell-k{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:9px;
}
.cell-v{font-size:16px;font-weight:500;line-height:1.3}
.cell-v.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- optional thumbnails ---------- */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;margin-top:12px;
}
.grid img{
  width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;
  border:1px solid var(--border);
}

/* ---------- note + footer ---------- */
.note{
  margin-top:12px;padding:20px 22px;border-radius:12px;
  border:1px solid var(--border);background:rgba(255,255,255,.02);
  color:var(--muted-mid);font-size:14px;
}
.foot{
  margin-top:72px;padding-top:28px;border-top:1px solid var(--border);
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;
}
.foot a{
  color:var(--muted-mid);text-decoration:none;font-size:14px;
  transition:color .3s var(--ease-out);
}
.foot a:hover{color:var(--white)}
.mantra{
  font-family:var(--font-display);font-style:italic;
  font-size:15px;color:var(--muted);
}

@media (max-width:600px){
  .wrap{padding:0 18px 72px}
  .head{padding:52px 0 40px}
  .deliver{padding:24px 20px}
  .btn,.expired{width:100%;justify-content:center}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <img src="/assets/blitz-wordmark-white.png" alt="Blitz">
    <span class="stamp" id="stamp"></span>
  </header>

  <div class="head">
    <div class="eyebrow">Delivery</div>
    <h1 class="client" id="client"></h1>
    <p class="project" id="project"></p>
  </div>

  <!-- DOWNLOAD ------------------------------------------------ -->
  <section class="deliver">
    <div class="deliver-label">Your files</div>
    <div id="dl"></div>
  </section>

  <!-- WHAT'S INSIDE -------------------------------------------- -->
  <section class="sect" id="sec-items" hidden>
    <div class="sect-label">Included in this delivery</div>
    <div id="items"></div>
    <div class="total" id="total" hidden>
      <span class="total-num" id="total-num"></span>
      <span class="total-txt">assets<br>delivered</span>
    </div>
  </section>

  <!-- SCOPE ----------------------------------------------------- -->
  <section class="sect" id="sec-scope" hidden>
    <div class="sect-label">Scope</div>
    <div class="scope" id="scope"></div>
    <div class="note" id="note" hidden></div>
  </section>

  <!-- THUMBS (optional) ----------------------------------------- -->
  <section class="sect" id="sec-thumbs" hidden>
    <div class="sect-label">Preview</div>
    <div class="grid" id="thumbs"></div>
  </section>

  <footer class="foot">
    <span class="mantra">AI for brands that refuse to look AI.</span>
    <a href="https://adsbyblitz.com" target="_blank" rel="noopener">adsbyblitz.com &nearr;</a>
  </footer>

</div>

<script>
/* ============================================================
   Everything below reads project.json. Don't edit per job.
   ============================================================ */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => (
  { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]
));

/* Dates render in the client's locale but are compared as plain
   calendar days — a link that dies "today" shouldn't die at 8pm
   because the browser is in another timezone. */
const day = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US',
  { year:'numeric', month:'long', day:'numeric' });

const today = () => new Date().toLocaleDateString('en-CA',
  { timeZone:'America/Puerto_Rico' });

const ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

fetch('project.json', { cache:'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(() => {
    $('client').textContent = 'Delivery unavailable';
    $('project').textContent = 'This link may have been moved. Get in touch and we’ll re-send it.';
    $('dl').innerHTML = '<a class="expired" href="mailto:adsbyblitz@gmail.com">Contact Blitz</a>';
  });

function render(p) {
  document.title = `${p.client} — ${p.project} | Blitz`;

  $('client').textContent  = p.client  || '';
  $('project').textContent = p.project || '';
  if (p.delivered) $('stamp').textContent = 'Delivered ' + day(p.delivered);

  /* ---- download button, or the expired state ---- */
  const d = p.download || {};
  const dead = d.expires && d.expires < today();

  if (d.url && !dead) {
    $('dl').innerHTML =
      `<a class="btn" href="${esc(d.url)}" target="_blank" rel="noopener">${ICON_DL} Download all files</a>` +
      (d.expires
        ? `<div class="expiry">Link stays live until <b>${esc(day(d.expires))}</b>. Save the files locally — we don’t archive transfers.</div>`
        : '');
  } else {
    const subj = encodeURIComponent(`Re-send files — ${p.client||''} / ${p.project||''}`);
    $('dl').innerHTML =
      `<a class="expired" href="mailto:adsbyblitz@gmail.com?subject=${subj}">Download link expired — request a re-send</a>` +
      `<div class="expiry">Transfers stay live for a limited window. We still have the masters — just ask.</div>`;
  }

  /* ---- what's inside ---- */
  const items = p.deliverables || [];
  if (items.length) {
    $('items').innerHTML = items.map(i =>
      `<div class="row"><span class="row-item">${esc(i.item)}</span>` +
      `<span class="row-qty">${esc(i.qty ?? '')}</span></div>`
    ).join('');
    $('sec-items').hidden = false;

    /* Lead with the count. A client reading an invoice should see
       the number of assets before they see the price again. */
    const n = items.reduce((s,i) => s + (Number(i.qty) || 0), 0);
    if (n > 1) { $('total-num').textContent = n; $('total').hidden = false; }
  }

  /* ---- scope ---- */
  const cells = [];
  if (p.licence)    cells.push(['Licence', p.licence, false]);
  if (p.turnaround) cells.push(['Turnaround', p.turnaround, false]);
  if (p.revisions)  cells.push(['Revisions', `${p.revisions.used} of ${p.revisions.total} used`, true]);
  if (p.delivered)  cells.push(['Delivered', day(p.delivered), false]);

  if (cells.length) {
    $('scope').innerHTML = cells.map(([k,v,mono]) =>
      `<div class="cell"><div class="cell-k">${esc(k)}</div>` +
      `<div class="cell-v${mono ? ' mono' : ''}">${esc(v)}</div></div>`
    ).join('');
    $('sec-scope').hidden = false;
  }

  if (p.note) { $('note').textContent = p.note; $('note').hidden = false; }

  /* ---- optional thumbnails: JPEGs next to this file ---- */
  if (p.thumbs && p.thumbs.length) {
    $('thumbs').innerHTML = p.thumbs.map(t =>
      `<img src="${esc(t)}" alt="" loading="lazy">`
    ).join('');
    $('sec-thumbs').hidden = false;
  }
}
</script>
</body>
</html>
